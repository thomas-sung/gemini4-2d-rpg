name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 檢出專案檔案 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 設定 Java 17 編譯環境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 產生 Android 設定檔並編譯簽署 APK
        run: |
          set -e
          JAVA_SRC=$(find . -maxdepth 2 -iname "mainactivity*.java" | head -n 1)
          if [ -z "$JAVA_SRC" ]; then
            echo "找不到 MainActivity.java 或 Mainactivity.java！"
            exit 1
          fi
          echo "找到遊戲主程式：$JAVA_SRC"

          rm -rf build_tmp
          mkdir -p build_tmp/src/org/aether/rpg build_tmp/res/values build_tmp/obj bin

          python3 -c '
          import sys, pathlib
          txt = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          parts = txt.split("package org.aether.rpg;")
          if len(parts) > 2:
              txt = "package org.aether.rpg;" + parts[1]
          pathlib.Path("build_tmp/src/org/aether/rpg/MainActivity.java").write_text(txt, encoding="utf-8")
          ' "$JAVA_SRC"

          cat << 'EOF' > build_tmp/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">星界迴響 2D</string>
          </resources>
          EOF

          cat << 'EOF' > build_tmp/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="org.aether.rpg"
              android:versionCode="3"
              android:versionName="3.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          PLATFORM=$(ls -d "$ANDROID_HOME/platforms/android-"* | sort -V | tail -n 1)

          "$BUILD_TOOLS/aapt2" compile build_tmp/res/values/strings.xml -o build_tmp/compiled_res.zip
          "$BUILD_TOOLS/aapt2" link -o build_tmp/unsigned.apk -I "$PLATFORM/android.jar" --manifest build_tmp/AndroidManifest.xml -R build_tmp/compiled_res.zip --auto-add-overlay

          javac -encoding UTF-8 -source 8 -target 8 -cp "$PLATFORM/android.jar" -d build_tmp/obj build_tmp/src/org/aether/rpg/MainActivity.java
          "$BUILD_TOOLS/d8" --lib "$PLATFORM/android.jar" --output build_tmp build_tmp/obj/org/aether/rpg/*.class

          zip -uj build_tmp/unsigned.apk build_tmp/classes.dex
          "$BUILD_TOOLS/zipalign" -f 4 build_tmp/unsigned.apk build_tmp/aligned.apk

          keytool -genkeypair -v -keystore build_tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS/apksigner" sign --ks build_tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --out bin/gemini4-2d-rpg.apk build_tmp/aligned.apk
          rm -rf build_tmp

      - name: 4. 自動將 APK 放回專案首頁 (README 旁) 與 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -f bin/gemini4-2d-rpg.apk ./gemini4-2d-rpg.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f gemini4-2d-rpg.apk
          git diff --staged --quiet || git commit -m "Auto-publish gemini4-2d-rpg.apk [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 bin/gemini4-2d-rpg.apk \
            --title "星界迴響 2D APK (最新版)" \
            --notes "直接點擊下方 gemini4-2d-rpg.apk 即可下載安裝（免解壓縮）！"
