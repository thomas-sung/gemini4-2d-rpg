              // ==================== 玩家移動、自動尋路與怪物巡邏 AI ====================
              void updateMonsterPatrols() {
                  if (inTitleScreen || isGenerating) return;
                  for (Entity e : entities) {
                      if ("monster".equals(e.type) && e.patrolRange > 0 && !e.stunned) {
                          int dir = rnd.nextBoolean() ? 1 : -1;
                          int ny = e.y + dir;
                          if (Math.abs(ny - e.homeY) <= e.patrolRange && ny > 1 && ny < WORLD_ROWS - 1 && grid[ny][e.x] != 1) {
                              if (!(e.x == px && ny == py)) {
                                  e.y = ny;
                              }
                          }
                      }
                  }
              }
          
              void stepAutoWalk() {
                  if (inTitleScreen || isGenerating || (targetWalkX == -1 && targetWalkY == -1)) return;
                  if (px == targetWalkX && py == targetWalkY) {
                      targetWalkX = -1; targetWalkY = -1;
                      return;
                  }
                  int dx = Integer.compare(targetWalkX, px);
                  int dy = Integer.compare(targetWalkY, py);
                  if (dx != 0 && grid[py][px + dx] != 1) {
                      movePlayer(dx, 0, false);
                  } else if (dy != 0 && grid[py + dy][px] != 1) {
                      movePlayer(0, dy, false);
                  } else {
                      targetWalkX = -1; targetWalkY = -1;
                  }
              }
          
              void movePlayer(int dx, int dy, boolean cancelAutoTarget) {
                  if (inTitleScreen || isGenerating) return;
                  if (cancelAutoTarget) { targetWalkX = -1; targetWalkY = -1; }
                  facingX = dx != 0 ? dx : facingX;
                  facingY = dy != 0 ? dy : facingY;
                  walkCycle += 1.2f;
          
                  int nx = px + dx, ny = py + dy;
                  if (nx < 0 || nx >= WORLD_COLS || ny < 0 || ny >= WORLD_ROWS || grid[ny][nx] == 1 || grid[ny][nx] == 5) {
                      targetWalkX = -1; targetWalkY = -1;
                      if (nx >= 0 && nx < WORLD_COLS && ny >= 0 && ny < WORLD_ROWS && grid[ny][nx] == 5) {
                          spawnFloat("🧱 裂縫牆(按右下斬擊/脈衝震碎)", nx, ny, Color.rgb(251, 191, 36));
                      } else {
                          spawnFloat("受阻", nx, ny, Color.rgb(148, 163, 184));
                      }
                      return;
                  }
                  for (Entity e : entities) {
                      if (e.x == nx && e.y == ny) {
                          targetWalkX = -1; targetWalkY = -1;
                          interactEntity(e);
                          return;
                      }
                  }
                  px = nx; py = ny;
          
                  // 踩上星光靈草 (4) 自動採集回血回魔
                  if (grid[ny][nx] == 4) {
                      grid[ny][nx] = 0;
                      hp = Math.min(maxHp, hp + 22);
                      mana = Math.min(maxMana, mana + 15);
                      gainExp(15);
                      spawnFloat("🌿 採集星光草 +22HP +15✨", px, py, Color.rgb(52, 211, 153));
                  } else if (grid[ny][nx] == 2) {
                      int dmg = Math.max(1, 4 - def / 5);
                      hp = Math.max(1, hp - dmg);
                      spawnFloat("-" + dmg + " HP 能量地形", px, py, Color.rgb(244, 63, 94));
                  }
          
                  if (isRoadMap) {
                      for (Entity e : entities) {
                          if ("monster".equals(e.type) && !e.triggered && !e.stunned && Math.abs(e.x - px) <= 1 && Math.abs(e.y - py) <= 1) {
                              e.triggered = true;
                              targetWalkX = -1; targetWalkY = -1;
                              spawnFloat("⚠️ 遭遇伏擊！", px, py, Color.rgb(244, 63, 94));
                              interactEntity(e);
                              break;
                          }
                      }
                  }
              }
          
              void interactNearby() {
                  if (inTitleScreen) return;
                  for (Entity e : entities) {
                      if (Math.abs(e.x - px) + Math.abs(e.y - py) <= 1) {
                          interactEntity(e);
                          return;
                      }
                  }
                  spawnFloat("請先靠近目標", px, py, Color.rgb(203, 213, 225));
              }
          
              void interactEntity(final Entity e) {
                  if ("teleport".equals(e.type)) {
                      handleTeleportChoice();
                      return;
                  }
                  if ("road_gate".equals(e.type)) {
                      new AlertDialog.Builder(this)
                          .setTitle("🚪 邊境古道口（徒步前往下一區）")
                          .setMessage("走古道不需消耗共鳴能量，但你必須親自操作角色走過荒野峽谷（可直接點擊古道地面自動行走），途中會根據你的因果旗標遭遇巡邏伏兵。\n\n確定要踏上古道嗎？")
                          .setPositiveButton("🥾 踏上古道（親自走過去）", new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface d, int w) {
                                  startRoadExpedition();
                              }
                          })
                          .setNegativeButton("暫留本區", null)
                          .show();
                      return;
                  }
                  if ("road_finish".equals(e.type)) {
                      triggerAutoCausalNextZone("WALK_ROAD", "");
                      return;
                  }
          
                  final ArrayList<Choice> validChoices = new ArrayList<Choice>();
                  for (Choice ch : e.choices) {
                      if (checkChoiceAllowed(ch)) validChoices.add(ch);
                  }
          
                  // 若敵人已被玩家先手「星輝斬擊/脈衝」擊暈破甲，自動新增無傷處決選項！
                  if ("monster".equals(e.type) && e.stunned) {
                      Choice stunWin = new Choice();
                      stunWin.label = "💥 【破甲壓制】趁敵人暈眩直接無傷收繳戰利品（HP不損，星幣+80，+70 EXP）";
                      stunWin.gold = 80; stunWin.exp = 70; stunWin.item = "破甲戰利徽記";
                      stunWin.log = "先手破甲擊暈並無傷制服了 " + e.name + "！";
                      stunWin.reply = e.name + " 因護甲碎裂無法反抗，只能交出所有寶物撤退！";
                      validChoices.add(0, stunWin);
                  }
          
                  if ("monster".equals(e.type) && isAllyOnline()) {
                      Choice coop = new Choice();
                      coop.label = "🤝 【區網雙人合擊】與連線盟友「" + ally.name + "」發動雙重奧義（無傷秒殺，星幣+100，+80 EXP）";
                      coop.gold = 100; coop.mana = 15; coop.exp = 80; coop.item = "雙星共鳴徽章";
                      coop.log = "與區網盟友「" + ally.name + "」聯手擊破了 " + e.name + "！";
                      coop.reply = "你與盟友的星盤同時綻放萬丈光芒，瞬間瓦解了強敵！";
                      validChoices.add(0, coop);
                  }
          
                  AlertDialog.Builder b = new AlertDialog.Builder(this);
                  b.setTitle("💬 " + e.name + (e.stunned ? "【💫破甲暈眩中】" : "") + "：" + e.greeting);
                  String[] items = new String[validChoices.size() + 1];
                  for (int i = 0; i < validChoices.size(); i++) items[i] = validChoices.get(i).label;
                  items[validChoices.size()] = "✨ 輸入自訂行動（系統將自動推演因果）...";
                  b.setItems(items, new DialogInterface.OnClickListener() {
                      @Override
                      public void onClick(DialogInterface d, int which) {
                          if (which < validChoices.size()) {
                              applyChoice(e, validChoices.get(which));
                          } else {
                              promptCustomAction(e);
                          }
                      }
                  });
                  if (!isRoadMap || !"monster".equals(e.type) || e.stunned) {
                      b.setNegativeButton("關閉", null);
                  }
                  b.show();
              }
          
              void handleTeleportChoice() {
                  final boolean hasRune = worldFlags.contains("HAS_TELEPORT_RUNE") || inventory.contains("星界傳送符");
                  String msg = hasRune
                      ? "你持有「星界傳送符」，可免費啟動傳送陣！\n傳送將直接跨越荒野峽谷安全抵達下一區，完全不會遭遇古道伏擊事件。"
                      : "啟動古代傳送陣需要消耗 25 點共鳴（目前共鳴：" + mana + "）。\n傳送可安全直達下一區，免去徒步走古道遭遇襲擊的麻煩！";
          
                  new AlertDialog.Builder(this)
                      .setTitle("🔮 古代傳送星陣")
                      .setMessage(msg)
                      .setPositiveButton(hasRune ? "✨ 使用傳送符安全傳送" : "🔮 消耗 25 共鳴安全傳送", new DialogInterface.OnClickListener() {
                          @Override
                          public void onClick(DialogInterface d, int w) {
                              if (!hasRune && mana < 25) {
                                  Toast.makeText(MainActivity.this, "共鳴不足 25 點！請先解開石碑謎題、開啟寶箱或改走東側「🚪邊境古道」。", Toast.LENGTH_LONG).show();
                                  return;
                              }
                              if (!hasRune) mana -= 25;
                              worldFlags.add("USED_SAFE_TELEPORT");
                              gainExp(35);
                              history.add("啟動古代傳送陣，避開荒野古道安全傳送至下一區。");
                              spawnFloat("🔮 空間傳送啟動！", px, py, Color.rgb(56, 189, 248));
                              triggerAutoCausalNextZone("TELEPORT", "");
                          }
                      })
                      .setNegativeButton("取消", null)
                      .show();
              }
          
              void applyChoice(Entity e, Choice c) {
                  if (c.gold < 0 && gold + c.gold < 0) {
                      Toast.makeText(this, "星幣不足！", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  // 防禦力自動減免負面傷害
                  int actualHpDelta = c.hp;
                  if (actualHpDelta < 0) {
                      actualHpDelta = Math.min(-1, actualHpDelta + def / 3);
                  }
                  hp = Math.max(1, Math.min(maxHp, hp + actualHpDelta));
                  mana = Math.max(0, Math.min(maxMana, mana + c.mana));
                  gold = Math.max(0, gold + c.gold);
                  if (actualHpDelta != 0) spawnFloat((actualHpDelta > 0 ? "+" : "") + actualHpDelta + " HP", px, py, actualHpDelta > 0 ? Color.rgb(52, 211, 153) : Color.rgb(251, 113, 133));
                  if (c.mana != 0) spawnFloat((c.mana > 0 ? "+" : "") + c.mana + " 共鳴", px, py - 0.4f, Color.rgb(129, 140, 248));
                  if (c.trait != null && !c.trait.isEmpty()) trait = c.trait;
                  if (c.addFlag != null && !c.addFlag.isEmpty()) worldFlags.add(c.addFlag);
                  if (c.removeFlag != null && !c.removeFlag.isEmpty()) worldFlags.remove(c.removeFlag);
                  if (c.item != null && !c.item.isEmpty() && !inventory.contains(c.item)) {
                      inventory.add(c.item);
                      recalcEquipmentStats();
                      spawnFloat("獲得 " + c.item, e.x, e.y, Color.rgb(251, 191, 36));
                  }
                  gainExp(c.exp > 0 ? c.exp : 30);
                  history.add("第" + zoneIndex + "區：" + c.log);
                  addLog("👉 " + c.log);
                  if (c.reply != null && !c.reply.isEmpty()) addLog("💬 " + c.reply);
                  if ("chest".equals(e.type) || "monster".equals(e.type) || "monolith".equals(e.type) || isRoadMap) {
                      entities.remove(e);
                  }
              }
          
              void promptCustomAction(final Entity e) {
                  final EditText et = new EditText(this);
                  et.setHint("輸入你對 " + e.name + " 的行動（系統將自動判斷後續因果）...");
                  new AlertDialog.Builder(this)
                      .setTitle("⚡ 自由行動（自動因果判定）")
                      .setView(et)
                      .setPositiveButton("執行行動", new DialogInterface.OnClickListener() {
                          @Override
                          public void onClick(DialogInterface d, int w) {
                              String act = et.getText().toString().trim();
                              if (!act.isEmpty()) evaluateCustomActionCausality(e, act);
                          }
                      })
                      .setNegativeButton("取消", null)
                      .show();
              }
          
              void evaluateCustomActionCausality(Entity e, String act) {
                  if (act.contains("殺") || act.contains("斬") || act.contains("毀") || act.contains("攻擊") || act.contains("搶")) {
                      worldFlags.add("HOSTILE_ACTION_" + e.id);
                      worldFlags.add("RUTHLESS_PATH");
                      worldFlags.remove("PEACEFUL_PATH");
                      trait = "冷酷破局者";
                      gold += 45;
                      hp = Math.max(1, hp - 8);
                      gainExp(45);
                      entities.remove(e);
                      addLog("⚔️ 你對「" + e.name + "」採取了強硬手段：「" + act + "」！該角色已從世界消失，後續將不會再出現其友好事件。");
                  } else if (act.contains("幫") || act.contains("救") || act.contains("治") || act.contains("送") || act.contains("結盟") || act.contains("收服")) {
                      worldFlags.add("ALLIED_WITH_" + e.id);
                      worldFlags.add("PEACEFUL_PATH");
                      if ("mob_sentinel".equals(e.id)) worldFlags.add("TAMED_SENTINEL");
                      trait = "星界締結者";
                      mana = Math.min(maxMana, mana + 15);
                      gainExp(45);
                      if ("monster".equals(e.type)) entities.remove(e);
                      addLog("🤝 你對「" + e.name + "」採取了結盟行動：「" + act + "」！已鎖定友好因果線，排除後續與其敵對的矛盾事件。");
                  } else {
                      worldFlags.add("CUSTOM_ACT_" + e.id);
                      mana = Math.min(maxMana, mana + 10);
                      trait = "奇策探索者";
                      gainExp(35);
                      if (isRoadMap) entities.remove(e);
                      addLog("✨ 你對「" + e.name + "」執行了：「" + act + "」，世界因果線已自動調整！");
                  }
                  history.add("第" + zoneIndex + "區自訂行動：對 " + e.name + "「" + act + "」");
                  spawnFloat("⚖️ 因果線已更新", px, py, Color.rgb(56, 189, 248));
              }
          
              // ==================== 多模型自動容錯 API 呼叫與因果生成 ====================
              void triggerAutoCausalNextZone(final String travelMode, final String extraNote) {
                  if (isGenerating) return;
                  isGenerating = true;
                  targetWalkX = -1; targetWalkY = -1;
                  addLog("⏳ 正在根據你的行動旗標 " + worldFlags.toString() + " 自動推演下一區...");
          
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          JSONObject result = null;
                          if (apiKey != null && !apiKey.isEmpty()) {
                              result = callGeminiWithModelFallback(travelMode, extraNote);
                          }
                          final JSONObject finalData = (result != null) ? result : buildCausalLocalZone(travelMode);
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  applyNewZone(finalData, travelMode);
                                  isGenerating = false;
                                  saveGameToSlot(1);
                              }
                          });
                      }
                  }).start();
              }
          
              JSONObject callGeminiWithModelFallback(String travelMode, String extraNote) {
                  String[] candidateModels = {
                      "gemini-2.5-flash",
                      "gemini-2.0-flash",
                      "gemini-3.8-flash",
                      "gemini-4-argon"
                  };
                  int nextNum = zoneIndex + 1;
                  String prompt = "你是 2D 遊戲《星界迴響》的「因果律檢核與劇本生成引擎」。請為玩家生成第 " + nextNum + " 區。"
                      + "\n1. 玩家已觸發的世界旗標：" + worldFlags.toString()
                      + "\n2. 玩家完整行動紀錄：" + history.toString()
                      + "\n3. 玩家進入本區的方式：" + ("TELEPORT".equals(travelMode) ? "透過古代傳送陣安全直達" : "親自徒步走過荒野古道抵達")
                      + "\n4. 玩家持有道具：" + inventory.toString() + "，等級 Lv." + level + "，傾向：" + trait
                      + "\n5. 嚴格排除任何與上述旗標矛盾的事件，並提供符合當下行動的選擇。"
                      + "\n請只回傳純 JSON 物件：{\"zoneTitle\":\"區域名稱\",\"biome\":\"forest或cyber或volcano或ruins\",\"openingNarration\":\"開場白(60字內)\",\"npcName\":\"符合因果的新NPC\",\"npcRole\":\"mage或ranger或mecha\",\"npcGreeting\":\"明確提到玩家上一區具體行為的台詞\",\"choice1Label\":\"符合當前狀態的選擇1\",\"choice1Item\":\"新道具\",\"choice1Flag\":\"NEW_FLAG_1\",\"choice1Reply\":\"回應1\",\"choice2Label\":\"符合當前狀態的選擇2\",\"choice2Flag\":\"NEW_FLAG_2\",\"choice2Reply\":\"回應2\",\"chestName\":\"寶箱名\",\"chestItem\":\"寶物名\",\"mobName\":\"符合因果的強敵名\",\"mobRole\":\"mecha或beast或bandit\",\"mobGreeting\":\"強敵台詞\",\"mobChoice1\":\"迎戰選項\",\"mobChoice2\":\"符合玩家持有道具的智取選項\"}";
          
                  for (final String modelName : candidateModels) {
                      try {
                          String endpoint = "https://generativelanguage.googleapis.com/v1beta/models/" + modelName + ":generateContent?key=" + apiKey.trim();
                          URL url = new URL(endpoint);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(12000);
                          conn.setReadTimeout(18000);
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                          conn.setDoOutput(true);
          
                          JSONObject reqBody = new JSONObject();
                          JSONArray contents = new JSONArray();
                          JSONObject partObj = new JSONObject().put("text", prompt);
                          contents.put(new JSONObject().put("parts", new JSONArray().put(partObj)));
                          reqBody.put("contents", contents);
                          reqBody.put("generationConfig", new JSONObject().put("responseMimeType", "application/json"));
          
                          OutputStream os = conn.getOutputStream();
                          os.write(reqBody.toString().getBytes("UTF-8"));
                          os.close();
          
                          int code = conn.getResponseCode();
                          if (code >= 200 && code < 300) {
                              BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), "UTF-8"));
                              StringBuilder sb = new StringBuilder();
                              String line;
                              while ((line = br.readLine()) != null) sb.append(line);
                              br.close();
          
                              JSONObject respJson = new JSONObject(sb.toString());
                              String raw = respJson.getJSONArray("candidates").getJSONObject(0)
                                  .getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text");
                              raw = raw.replace("```json", "").replace("```", "").trim();
                              JSONObject parsed = new JSONObject(raw);
                              activeModelUsed = "雲端 AI (" + modelName + ")";
                              return parsed;
                          }
                      } catch (Exception ignored) {}
                  }
                  activeModelUsed = "本機因果檢核引擎";
                  return null;
              }
          
