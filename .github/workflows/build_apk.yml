              void applyNewZone(JSONObject d, String travelMode) {
                  isRoadMap = false;
                  targetWalkX = -1; targetWalkY = -1;
                  zoneIndex++;
                  zoneTitle = d.optString("zoneTitle", "第" + zoneIndex + "區：未知星域");
                  biome = d.optString("biome", "forest");
          
                  for (int r = 0; r < WORLD_ROWS; r++) {
                      for (int c = 0; c < WORLD_COLS; c++) {
                          if (r == 0 || r == WORLD_ROWS - 1 || c == 0 || c == WORLD_COLS - 1) grid[r][c] = 1;
                          else if (r == 7 && c >= 2 && c <= 22) grid[r][c] = 3;
                          else if (c == 14 && r >= 2 && r <= 7) grid[r][c] = 3;
                          else grid[r][c] = 0;
                      }
                  }
                  int[][] walls = {{7,2},{7,3},{7,10},{7,11},{12,4},{12,5},{16,9},{16,10}};
                  for (int[] w : walls) grid[w[1]][w[0]] = 1;
                  grid[3][7] = 5; grid[10][12] = 5; // 裂縫密室牆
                  grid[2][5] = 4; grid[11][6] = 4; grid[5][19] = 4; // 星光靈草
                  grid[4][9] = 2; grid[9][13] = 2; grid[4][18] = 2;
          
                  px = 3; py = 7; renderPx = 3f; renderPy = 7f;
                  entities.clear();
          
                  Entity npc = new Entity("npc_z" + zoneIndex, "npc", d.optString("npcName", "區域引路人"), 6, 6);
                  npc.roleStyle = d.optString("npcRole", "mage");
                  npc.greeting = d.optString("npcGreeting", "「你的過去決定了今日的相遇。」");
                  Choice c1 = new Choice();
                  c1.label = d.optString("choice1Label", "進行因果共鳴");
                  c1.mana = 20; c1.hp = 15; c1.exp = 50; c1.item = d.optString("choice1Item", "星界符印");
                  c1.addFlag = d.optString("choice1Flag", "ZONE_" + zoneIndex + "_ALLY");
                  c1.log = "與 " + npc.name + " 完成因果互動。"; c1.reply = d.optString("choice1Reply", "獲得新的祝福！");
                  Choice c2 = new Choice();
                  c2.label = d.optString("choice2Label", "索取區域支援");
                  c2.gold = 60; c2.mana = 15; c2.exp = 45;
                  c2.addFlag = d.optString("choice2Flag", "ZONE_" + zoneIndex + "_SUPPORT");
                  if (c2.label.contains("傳送符")) c2.item = "星界傳送符";
                  c2.log = "從 " + npc.name + " 取得支援。"; c2.reply = d.optString("choice2Reply", "祝你一路順風！");
                  npc.choices.add(c1); npc.choices.add(c2);
                  entities.add(npc);
          
                  Entity chest = new Entity("chest_z" + zoneIndex, "chest", d.optString("chestName", "星界秘寶箱"), 10, 3);
                  chest.greeting = "散發著星輝的區域寶箱。";
                  Choice cc = new Choice();
                  cc.label = "💎 開啟寶箱並補充傳送能量（共鳴+25，星幣+55，+40 EXP）";
                  cc.mana = 25; cc.gold = 55; cc.exp = 40; cc.item = d.optString("chestItem", "星界秘寶");
                  cc.log = "開啟了 " + chest.name + "。"; cc.reply = "獲得珍貴秘寶與共鳴能量！";
                  chest.choices.add(cc);
                  entities.add(chest);
          
                  Entity mob = new Entity("mob_z" + zoneIndex, "monster", d.optString("mobName", "區域統領"), 16, 7);
                  mob.roleStyle = d.optString("mobRole", "mecha");
                  mob.patrolRange = 2;
                  mob.greeting = d.optString("mobGreeting", "「證明你的實力吧！」");
                  Choice mc1 = new Choice();
                  mc1.label = d.optString("mobChoice1", "⚔️ 正面迎戰擊破統領（HP-15，星幣+85，+70 EXP）");
                  mc1.hp = -15; mc1.gold = 85; mc1.exp = 70; mc1.item = "統領之證·" + zoneIndex;
                  mc1.log = "正面擊敗了 " + mob.name + "。"; mc1.reply = "統領倒下，前往下一區的道路已暢通！";
                  Choice mc2 = new Choice();
                  mc2.label = d.optString("mobChoice2", "🌟 運用信物與智慧壓制統領（共鳴-10，星幣+75，+65 EXP）");
                  mc2.mana = -10; mc2.hp = 10; mc2.gold = 75; mc2.exp = 65;
                  mc2.log = "巧妙壓制了 " + mob.name + "。"; mc2.reply = "統領對你的實力心服口服，主動讓開了道路！";
                  mob.choices.add(mc1); mob.choices.add(mc2);
                  entities.add(mob);
          
                  entities.add(new Entity("exit_teleport_" + zoneIndex, "teleport", "🔮 古代傳送陣(安全直達)", 14, 2));
                  entities.add(new Entity("exit_road_" + zoneIndex, "road_gate", "🚪 邊境古道(徒步前往下一區)", 22, 7));
          
                  spawnFloat("✨ 抵達 " + zoneTitle, px, py, Color.rgb(192, 132, 252));
                  addLog("🎬 【" + zoneTitle + "】(" + activeModelUsed + ") " + d.optString("openingNarration", ""));
              }
          
              void openSystemMenuDialog() {
                  String[] menuItems = {
                      "💾 儲存進度 (3 個存檔槽)",
                      "📂 讀取進度 (3 個存檔槽)",
                      "📡 區網雙人共遊 ＆ 喊話 (" + (isAllyOnline() ? "已連上：" + ally.name : (lanEnabled ? "搜尋中" : "未開啟")) + ")",
                      "📊 查看角色詳細屬性與因果紀錄",
                      "⚙️ Gemini API 金鑰設定",
                      "🏠 返回遊戲主畫面 (Title Screen)"
                  };
                  new AlertDialog.Builder(this)
                      .setTitle("🧭 系統選單 ＆ 區網共遊")
                      .setItems(menuItems, new DialogInterface.OnClickListener() {
                          @Override
                          public void onClick(DialogInterface d, int which) {
                              if (which == 0) openSaveLoadDialog(true);
                              else if (which == 1) openSaveLoadDialog(false);
                              else if (which == 2) openLanDialog();
                              else if (which == 3) showCharacterSheetDialog();
                              else if (which == 4) openApiKeyDialog();
                              else if (which == 5) inTitleScreen = true;
                          }
                      })
                      .setNegativeButton("繼續遊戲", null)
                      .show();
              }
          
              void showCharacterSheetDialog() {
                  String info = "【角色名稱】" + playerName + " (Lv." + level + " " + trait + ")\n"
                      + "【經驗進度】" + exp + " / " + nextExp + " EXP\n"
                      + "【生命與共鳴】❤️ " + hp + "/" + maxHp + "  |  ✨ " + mana + "/" + maxMana + "\n"
                      + "【戰鬥能力】⚔️ 攻擊力：" + atk + "  |  🛡️ 防禦力：" + def + "\n"
                      + "【持有信物】" + inventory.toString() + "\n"
                      + "【生效因果旗標】" + (worldFlags.isEmpty() ? "[初始狀態]" : worldFlags.toString());
                  new AlertDialog.Builder(this)
                      .setTitle("📊 角色面板與世界因果律")
                      .setMessage(info)
                      .setPositiveButton("確定", null)
                      .show();
              }
          
              void openApiKeyDialog() {
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(36, 20, 36, 10);
                  final EditText keyEt = new EditText(this);
                  keyEt.setHint("貼上 Google AI Studio 的 Gemini API Key (選填)");
                  keyEt.setText(apiKey);
                  layout.addView(keyEt);
          
                  new AlertDialog.Builder(this)
                      .setTitle("⚙️ Gemini 動態因果引擎設定")
                      .setMessage("已內建多模型自動切換容錯（支援 gemini-2.5-flash / 2.0-flash / 3.8-flash / 4-argon 與本機因果檢核引擎）！")
                      .setView(layout)
                      .setPositiveButton("💾 儲存金鑰", new DialogInterface.OnClickListener() {
                          @Override
                          public void onClick(DialogInterface d, int w) {
                              apiKey = keyEt.getText().toString().trim();
                              getSharedPreferences("gemini4_rpg_v5", Context.MODE_PRIVATE)
                                  .edit().putString("api_key", apiKey).apply();
                              Toast.makeText(MainActivity.this, "已儲存 API Key！", Toast.LENGTH_SHORT).show();
                          }
                      })
                      .setNegativeButton("關閉", null)
                      .show();
              }
          
              // ==================== 繪圖引擎（主畫面 + 自動尋路準星 + 劍氣動畫 + 巡邏怪） ====================
              class GameView extends View {
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Paint strokeP = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Path path = new Path();
                  RectF[] btnRects = new RectF[6];
                  RectF[] titleBtns = new RectF[4];
                  String[] btnLabels = {"◀ 左移", "▲ 上移", "▼ 下移", "▶ 右移", "💬 A 互動", "🗡️ 斬擊/脈衝"};
                  RectF menuTopBtn = new RectF();
                  int pressedBtn = -1;
                  long lastHoldMoveTime = 0;
                  long tick = 0;
          
                  public GameView(Context ctx) {
                      super(ctx);
                      strokeP.setStyle(Paint.Style.STROKE);
                  }
          
                  void drawDetailedHero(Canvas c, float cx, float cy, float scale, boolean hasDrone, boolean isAllyAvatar) {
                      float bob = (float) Math.sin(tick * 0.2f + (isAllyAvatar ? 2f : 0f)) * (scale * 0.04f);
                      float legSwing = (float) Math.sin(walkCycle) * (scale * 0.14f);
                      boolean hasHeavyBlade = inventory.contains("斬鐵星刃") || inventory.contains("深淵魔晶");
                      boolean hasAegis = inventory.contains("守護紋章") || inventory.contains("高階裝甲片");
          
                      p.setShader(new RadialGradient(cx, cy + scale * 0.42f, scale * 0.65f,
                          isAllyAvatar ? Color.argb(170, 16, 185, 129) : Color.argb(160, 99, 102, 241),
                          Color.TRANSPARENT, Shader.TileMode.CLAMP));
                      c.drawCircle(cx, cy + scale * 0.42f, scale * 0.65f, p);
                      p.setShader(null);
          
                      if (!isAllyAvatar && hasAegis) {
                          strokeP.setColor(Color.argb(140, 251, 191, 36));
                          strokeP.setStrokeWidth(2.5f);
                          c.drawCircle(cx, cy, scale * 0.56f, strokeP);
                      }
          
                      path.reset();
                      float capeDir = -facingX * scale * 0.28f;
                      float wave = (float) Math.sin(tick * 0.18f) * (scale * 0.08f);
                      path.moveTo(cx - scale * 0.22f, cy - scale * 0.12f + bob);
                      path.lineTo(cx + scale * 0.22f, cy - scale * 0.12f + bob);
                      path.lineTo(cx + scale * 0.30f + capeDir + wave, cy + scale * 0.40f + bob);
                      path.lineTo(cx - scale * 0.30f + capeDir + wave, cy + scale * 0.40f + bob);
                      path.close();
                      p.setColor(isAllyAvatar ? Color.rgb(5, 150, 105) : Color.rgb(190, 18, 60));
                      c.drawPath(path, p);
          
                      p.setColor(Color.rgb(30, 41, 59));
                      c.drawRoundRect(new RectF(cx - scale * 0.20f, cy + scale * 0.18f + legSwing * 0.4f, cx - scale * 0.04f, cy + scale * 0.44f + legSwing * 0.4f), 5, 5, p);
                      c.drawRoundRect(new RectF(cx + scale * 0.04f, cy + scale * 0.18f - legSwing * 0.4f, cx + scale * 0.20f, cy + scale * 0.44f - legSwing * 0.4f), 5, 5, p);
          
                      RectF armor = new RectF(cx - scale * 0.25f, cy - scale * 0.14f + bob, cx + scale * 0.25f, cy + scale * 0.24f + bob);
                      p.setShader(new LinearGradient(armor.left, armor.top, armor.right, armor.bottom,
                          isAllyAvatar ? Color.rgb(14, 165, 233) : Color.rgb(79, 70, 229),
                          isAllyAvatar ? Color.rgb(3, 105, 161) : Color.rgb(49, 46, 129), Shader.TileMode.CLAMP));
                      c.drawRoundRect(armor, 8, 8, p);
                      p.setShader(null);
          
                      p.setColor(Color.rgb(251, 191, 36));
                      c.drawOval(new RectF(cx - scale * 0.34f, cy - scale * 0.16f + bob, cx - scale * 0.14f, cy - scale * 0.02f + bob), p);
                      c.drawOval(new RectF(cx + scale * 0.14f, cy - scale * 0.16f + bob, cx + scale * 0.34f, cy - scale * 0.02f + bob), p);
                      c.drawRect(cx - scale * 0.25f, cy + scale * 0.12f + bob, cx + scale * 0.25f, cy + scale * 0.18f + bob, p);
          
                      float headY = cy - scale * 0.34f + bob;
                      float headR = scale * 0.23f;
                      p.setColor(Color.rgb(255, 228, 196));
                      c.drawCircle(cx, headY, headR, p);
          
                      float eyeOff = facingX * scale * 0.05f;
                      p.setColor(Color.rgb(15, 23, 42));
                      c.drawCircle(cx - scale * 0.08f + eyeOff, headY + scale * 0.02f, scale * 0.035f, p);
                      c.drawCircle(cx + scale * 0.08f + eyeOff, headY + scale * 0.02f, scale * 0.035f, p);
          
                      p.setColor(isAllyAvatar ? Color.rgb(253, 230, 138) : Color.rgb(226, 232, 240));
                      c.drawArc(new RectF(cx - headR * 1.15f, headY - headR * 1.2f, cx + headR * 1.15f, headY + headR * 0.4f), 165, 210, true, p);
                      p.setColor(Color.rgb(251, 191, 36));
                      c.drawRect(cx - headR * 0.7f, headY - headR * 0.65f, cx + headR * 0.7f, headY - headR * 0.42f, p);
          
                      RectF shield = new RectF(cx - scale * 0.44f, cy - scale * 0.08f + bob, cx - scale * 0.22f, cy + scale * 0.24f + bob);
                      p.setColor(Color.rgb(30, 58, 138));
                      c.drawRoundRect(shield, 6, 6, p);
                      strokeP.setColor(Color.rgb(251, 191, 36));
                      strokeP.setStrokeWidth(2.2f);
                      c.drawRoundRect(shield, 6, 6, strokeP);
          
                      float swordX = cx + scale * 0.34f;
                      float swordY = cy + scale * 0.06f + bob;
                      strokeP.setColor(hasHeavyBlade && !isAllyAvatar ? Color.rgb(245, 158, 11) : (isAllyAvatar ? Color.rgb(52, 211, 153) : Color.rgb(56, 189, 248)));
                      strokeP.setStrokeWidth(hasHeavyBlade ? 6.0f : 4.5f);
                      c.drawLine(swordX, swordY, swordX + scale * 0.26f, swordY - scale * 0.50f, strokeP);
                      strokeP.setColor(Color.WHITE);
                      strokeP.setStrokeWidth(2.0f);
                      c.drawLine(swordX, swordY, swordX + scale * 0.26f, swordY - scale * 0.50f, strokeP);
          
                      // 揮劍斬擊弧光動畫
                      if (!isAllyAvatar && swordSlashAngle > 0f) {
                          strokeP.setColor(Color.argb((int)(swordSlashAngle * 240), 253, 230, 138));
                          strokeP.setStrokeWidth(7f);
                          RectF slashOval = new RectF(cx - scale * 0.85f, cy - scale * 0.85f, cx + scale * 0.85f, cy + scale * 0.85f);
                          c.drawArc(slashOval, -60, 140, false, strokeP);
                          swordSlashAngle -= 0.22f;
                          if (swordSlashAngle < 0f) swordSlashAngle = 0f;
                      }
          
                      if (hasDrone) {
                          float dx = cx - scale * 0.55f + (float)Math.cos(tick * 0.12f) * (scale * 0.08f);
                          float dy = cy - scale * 0.48f + (float)Math.sin(tick * 0.15f) * (scale * 0.08f);
                          p.setColor(Color.rgb(56, 189, 248));
                          c.drawCircle(dx, dy, scale * 0.14f, p);
                          p.setColor(Color.WHITE);
                          c.drawCircle(dx, dy, scale * 0.06f, p);
                          strokeP.setColor(Color.rgb(165, 243, 252));
                          strokeP.setStrokeWidth(1.8f);
                          c.drawCircle(dx, dy, scale * 0.20f, strokeP);
                      }
                  }
          
                  void drawDetailedEntity(Canvas c, Entity e, float cx, float cy, float scale) {
                      float bob = (float) Math.sin(tick * 0.12f + e.x) * (scale * 0.04f);
                      if ("teleport".equals(e.type)) {
                          p.setShader(new RadialGradient(cx, cy, scale * 0.72f,
                              Color.argb(210, 56, 189, 248), Color.TRANSPARENT, Shader.TileMode.CLAMP));
                          c.drawCircle(cx, cy, scale * 0.72f, p);
                          p.setShader(null);
                          strokeP.setColor(Color.rgb(125, 211, 252));
                          strokeP.setStrokeWidth(3f);
                          c.drawCircle(cx, cy, scale * 0.46f, strokeP);
                          strokeP.setColor(Color.rgb(224, 242, 254));
                          c.drawCircle(cx, cy, scale * 0.26f, strokeP);
                          return;
                      }
                      if ("road_gate".equals(e.type) || "road_finish".equals(e.type)) {
                          RectF arch = new RectF(cx - scale * 0.42f, cy - scale * 0.48f, cx + scale * 0.42f, cy + scale * 0.42f);
                          p.setColor(Color.rgb(120, 53, 15));
                          c.drawRoundRect(arch, 12, 12, p);
                          strokeP.setColor(Color.rgb(251, 191, 36));
                          strokeP.setStrokeWidth(3.5f);
                          c.drawRoundRect(arch, 12, 12, strokeP);
                          p.setColor(Color.rgb(254, 243, 199));
                          c.drawCircle(cx, cy - scale * 0.1f, scale * 0.12f, p);
                          return;
                      }
                      if ("monolith".equals(e.type)) {
                          RectF stone = new RectF(cx - scale * 0.28f, cy - scale * 0.46f, cx + scale * 0.28f, cy + scale * 0.40f);
                          p.setColor(Color.rgb(51, 65, 85));
                          c.drawRoundRect(stone, 8, 8, p);
                          strokeP.setColor(Color.rgb(56, 189, 248));
                          strokeP.setStrokeWidth(2.5f);
                          c.drawRoundRect(stone, 8, 8, strokeP);
                          p.setColor(Color.rgb(56, 189, 248));
                          c.drawCircle(cx, cy - scale * 0.1f + bob * 0.4f, scale * 0.11f, p);
                          return;
                      }
                      if ("chest".equals(e.type)) {
                          RectF box = new RectF(cx - scale * 0.36f, cy - scale * 0.22f + bob * 0.5f, cx + scale * 0.36f, cy + scale * 0.32f + bob * 0.5f);
                          p.setColor(Color.rgb(146, 64, 14));
                          c.drawRoundRect(box, 8, 8, p);
                          strokeP.setColor(Color.rgb(251, 191, 36));
                          strokeP.setStrokeWidth(3f);
                          c.drawRoundRect(box, 8, 8, strokeP);
                          p.setColor(Color.rgb(56, 189, 248));
                          c.drawCircle(cx, box.centerY(), scale * 0.08f, p);
                          return;
                      }
                      if ("monster".equals(e.type)) {
                          p.setShader(new RadialGradient(cx, cy + bob, scale * 0.65f,
                              e.stunned ? Color.argb(160, 56, 189, 248) : Color.argb(150, 244, 63, 94),
                              Color.TRANSPARENT, Shader.TileMode.CLAMP));
                          c.drawCircle(cx, cy + bob, scale * 0.65f, p);
                          p.setShader(null);
                          p.setColor("mecha".equals(e.roleStyle) ? Color.rgb(71, 85, 105) : Color.rgb(136, 19, 55));
                          c.drawRoundRect(new RectF(cx - scale * 0.34f, cy - scale * 0.22f + bob, cx + scale * 0.34f, cy + scale * 0.36f + bob), 10, 10, p);
                          p.setColor(e.stunned ? Color.rgb(56, 189, 248) : Color.rgb(225, 29, 72));
                          c.drawOval(new RectF(cx - scale * 0.48f, cy - scale * 0.24f + bob, cx - scale * 0.22f, cy + scale * 0.02f + bob), p);
                          c.drawOval(new RectF(cx + scale * 0.22f, cy - scale * 0.24f + bob, cx + scale * 0.48f, cy + scale * 0.02f + bob), p);
                          p.setColor(Color.rgb(251, 191, 36));
                          c.drawCircle(cx, cy + scale * 0.08f + bob, scale * 0.09f, p);
                          p.setColor(Color.rgb(30, 41, 59));
                          c.drawCircle(cx, cy - scale * 0.32f + bob, scale * 0.22f, p);
                          p.setColor(Color.rgb(254, 240, 138));
                          c.drawRect(cx - scale * 0.14f, cy - scale * 0.35f + bob, cx - scale * 0.03f, cy - scale * 0.29f + bob, p);
                          c.drawRect(cx + scale * 0.03f, cy - scale * 0.35f + bob, cx + scale * 0.14f, cy - scale * 0.29f + bob, p);
                          return;
                      }
          
                      p.setColor("ranger".equals(e.roleStyle) ? Color.rgb(16, 185, 129) : Color.rgb(14, 165, 233));
                      c.drawRoundRect(new RectF(cx - scale * 0.26f, cy - scale * 0.12f + bob, cx + scale * 0.26f, cy + scale * 0.38f + bob), 10, 10, p);
                      strokeP.setColor(Color.rgb(253, 230, 138));
                      strokeP.setStrokeWidth(2f);
                      c.drawLine(cx, cy - scale * 0.10f + bob, cx, cy + scale * 0.36f + bob, strokeP);
                      p.setColor(Color.rgb(255, 228, 196));
                      c.drawCircle(cx, cy - scale * 0.28f + bob, scale * 0.19f, p);
                      p.setColor(Color.rgb(30, 58, 138));
                      c.drawArc(new RectF(cx - scale * 0.24f, cy - scale * 0.52f + bob, cx + scale * 0.24f, cy - scale * 0.20f + bob), 180, 180, true, p);
                      strokeP.setColor(Color.rgb(217, 119, 6));
                      strokeP.setStrokeWidth(3.2f);
                      c.drawLine(cx + scale * 0.32f, cy - scale * 0.36f + bob, cx + scale * 0.32f, cy + scale * 0.38f + bob, strokeP);
                      p.setColor(Color.rgb(56, 189, 248));
                      c.drawCircle(cx + scale * 0.32f, cy - scale * 0.40f + bob, scale * 0.08f, p);
                  }
          
                  void drawTitleScreen(Canvas canvas, int w, int h) {
                      p.setShader(new LinearGradient(0, 0, w, h,
                          Color.rgb(10, 15, 32), Color.rgb(28, 22, 62), Shader.TileMode.CLAMP));
                      canvas.drawRect(0, 0, w, h, p);
                      p.setShader(null);
          
                      for (Particle pt : particles) {
                          pt.rx += pt.vx; pt.ry += pt.vy;
                          if (pt.ry < 0f) pt.ry = 1f;
                          if (pt.rx < 0f) pt.rx = 1f;
                          if (pt.rx > 1f) pt.rx = 0f;
                          p.setColor(Color.rgb(165, 180, 252));
                          p.setAlpha((int)(pt.alpha * 200));
                          canvas.drawCircle(pt.rx * w, pt.ry * h, pt.size * 1.3f, p);
                      }
                      p.setAlpha(255);
          
                      float heroX = w * 0.27f, heroY = h * 0.54f;
                      p.setShader(new RadialGradient(heroX, heroY + h * 0.12f, h * 0.28f,
                          Color.argb(140, 99, 102, 241), Color.TRANSPARENT, Shader.TileMode.CLAMP));
                      canvas.drawCircle(heroX, heroY + h * 0.12f, h * 0.28f, p);
                      p.setShader(null);
                      drawDetailedHero(canvas, heroX, heroY, h * 0.36f, true, false);
          
                      p.setTypeface(Typeface.DEFAULT_BOLD);
                      p.setTextSize(Math.max(36f, h * 0.072f));
                      p.setColor(Color.rgb(251, 191, 36));
                      canvas.drawText("✨ 星界迴響 2D", w * 0.46f, h * 0.20f, p);
          
                      p.setTextSize(Math.max(18f, h * 0.032f));
                      p.setColor(Color.rgb(165, 180, 252));
                      canvas.drawText("v5 自動尋路 · 等級神裝 · 區網雙人共遊版", w * 0.46f, h * 0.28f, p);
          
                      String[] tLabels = {
                          "⚔️ 開始新冒險 (進入大世界)",
                          "📂 讀取進度存檔 (1~3 槽位)",
                          "📡 區網雙人連線 (IP: " + myLocalIp + ")",
                          "⚙️ Gemini API 金鑰與設定"
                      };
                      int[] bColors = {
                          Color.rgb(79, 70, 229),
                          Color.rgb(14, 116, 144),
                          Color.rgb(5, 150, 105),
                          Color.rgb(180, 83, 9)
                      };
                      float bx = w * 0.46f, bw = w * 0.46f, bh = h * 0.115f;
                      p.setTextSize(Math.max(20f, h * 0.033f));
                      for (int i = 0; i < 4; i++) {
                          float by = h * 0.35f + i * (bh + h * 0.032f);
                          titleBtns[i] = new RectF(bx, by, bx + bw, by + bh);
                          p.setColor(bColors[i]);
                          canvas.drawRoundRect(titleBtns[i], 18, 18, p);
                          strokeP.setColor(Color.rgb(226, 232, 240));
                          strokeP.setStrokeWidth(2.2f);
                          canvas.drawRoundRect(titleBtns[i], 18, 18, strokeP);
                          p.setColor(Color.WHITE);
                          canvas.drawText(tLabels[i], bx + 26, by + bh * 0.63f, p);
                      }
                  }
          
                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      tick++;
                      int w = getWidth(), h = getHeight();
                      if (inTitleScreen) {
                          drawTitleScreen(canvas, w, h);
                          postInvalidateDelayed(33);
                          return;
                      }
          
                      // 處理按住方向鍵連續行走 & 點擊地面自動尋路 & 怪物巡邏 AI
                      long now = System.currentTimeMillis();
                      if (pressedBtn >= 0 && pressedBtn <= 3 && now - lastHoldMoveTime > 150) {
                          lastHoldMoveTime = now;
                          if (pressedBtn == 0) movePlayer(-1, 0, true);
                          else if (pressedBtn == 1) movePlayer(0, -1, true);
                          else if (pressedBtn == 2) movePlayer(0, 1, true);
                          else if (pressedBtn == 3) movePlayer(1, 0, true);
                      } else if (tick % 5 == 0 && (targetWalkX != -1 || targetWalkY != -1)) {
                          stepAutoWalk();
                      }
                      if (tick % 24 == 0) {
                          updateMonsterPatrols();
                      }
          
                      renderPx += (px - renderPx) * 0.32f;
                      renderPy += (py - renderPy) * 0.32f;
                      for (Entity e : entities) {
                          e.renderX += (e.x - e.renderX) * 0.25f;
                          e.renderY += (e.y - e.renderY) * 0.25f;
                      }
                      if (isAllyOnline()) {
                          ally.renderX += (ally.x - ally.renderX) * 0.30f;
                          ally.renderY += (ally.y - ally.renderY) * 0.30f;
                      }
          
                      p.setShader(new LinearGradient(0, 0, 0, h,
                          Color.rgb(8, 12, 24), Color.rgb(17, 24, 39), Shader.TileMode.CLAMP));
                      canvas.drawRect(0, 0, w, h, p);
                      p.setShader(null);
          
                      int topH = (int)(h * 0.12f);
                      int botH = (int)(h * 0.16f);
                      int midH = h - topH - botH - 18;
                      int mapW = (int)(w * 0.64f);
                      float mapX = 12, mapY = topH + 8;
          
                      float tileW = mapW / VIEW_COLS;
                      float tileH = midH / VIEW_ROWS;
                      float scale = Math.min(tileW, tileH);
          
                      float targetCamX = Math.max(0f, Math.min(WORLD_COLS - VIEW_COLS, renderPx - VIEW_COLS / 2f + 0.5f));
                      float targetCamY = Math.max(0f, Math.min(WORLD_ROWS - VIEW_ROWS, renderPy - VIEW_ROWS / 2f + 0.5f));
                      camX += (targetCamX - camX) * 0.25f;
                      camY += (targetCamY - camY) * 0.25f;
          
                      // 1. 頂部 HUD
                      RectF hudRect = new RectF(12, 6, w - 12, topH);
                      p.setColor(Color.rgb(20, 30, 55));
                      canvas.drawRoundRect(hudRect, 16, 16, p);
                      strokeP.setStrokeWidth(2f);
                      strokeP.setColor(Color.rgb(99, 102, 241));
                      canvas.drawRoundRect(hudRect, 16, 16, strokeP);
          
                      p.setColor(Color.WHITE);
                      p.setTypeface(Typeface.DEFAULT_BOLD);
                      p.setTextSize(Math.max(16f, h * 0.025f));
                      String modeTag = isRoadMap ? "【🥾古道】" : "【" + zoneTitle + "】";
                      String lanTag = isAllyOnline() ? " 🟢" + ally.name : "";
                      canvas.drawText(modeTag + " Lv." + level + " ❤️" + hp + "/" + maxHp + " ✨" + mana + " ⚔️" + atk + " 🪙" + gold + lanTag, 22, topH * 0.66f, p);
          
                      menuTopBtn.set(w - w * 0.19f - 18, 12, w - 20, topH - 6);
                      p.setColor(Color.rgb(217, 119, 6));
                      canvas.drawRoundRect(menuTopBtn, 12, 12, p);
                      p.setColor(Color.WHITE);
                      float mw = p.measureText("💾 選單/連線");
                      canvas.drawText("💾 選單/連線", menuTopBtn.centerX() - mw / 2, menuTopBtn.centerY() + h * 0.009f, p);
          
                      // 2. 繪製大世界捲動地圖
                      canvas.save();
                      canvas.clipRect(mapX, mapY, mapX + mapW, mapY + midH);
          
                      int fl1 = Color.rgb(22, 32, 58), fl2 = Color.rgb(28, 41, 72), roadCol = Color.rgb(55, 65, 88);
                      int wallTop = Color.rgb(71, 85, 105), wallSide = Color.rgb(40, 50, 70), runeCol = Color.rgb(129, 140, 248);
                      if ("forest".equals(biome)) {
                          fl1 = Color.rgb(14, 42, 32); fl2 = Color.rgb(20, 54, 42); roadCol = Color.rgb(75, 85, 60);
                          wallTop = Color.rgb(22, 101, 52); wallSide = Color.rgb(14, 65, 34); runeCol = Color.rgb(52, 211, 153);
                      } else if ("cyber".equals(biome)) {
                          fl1 = Color.rgb(16, 20, 48); fl2 = Color.rgb(26, 30, 68); roadCol = Color.rgb(49, 46, 129);
                          wallTop = Color.rgb(67, 56, 202); wallSide = Color.rgb(40, 35, 130); runeCol = Color.rgb(56, 189, 248);
                      } else if ("volcano".equals(biome)) {
                          fl1 = Color.rgb(45, 18, 22); fl2 = Color.rgb(60, 24, 30); roadCol = Color.rgb(87, 38, 32);
                          wallTop = Color.rgb(153, 27, 27); wallSide = Color.rgb(95, 15, 15); runeCol = Color.rgb(251, 146, 60);
                      }
          
                      int startC = Math.max(0, (int)camX);
                      int endC = Math.min(WORLD_COLS - 1, (int)(camX + VIEW_COLS + 1));
                      int startR = Math.max(0, (int)camY);
                      int endR = Math.min(WORLD_ROWS - 1, (int)(camY + VIEW_ROWS + 1));
          
                      for (int r = startR; r <= endR; r++) {
                          for (int c = startC; c <= endC; c++) {
                              float sx = mapX + (c - camX) * tileW;
                              float sy = mapY + (r - camY) * tileH;
                              RectF tr = new RectF(sx + 1, sy + 1, sx + tileW - 1, sy + tileH - 1);
                              if (grid[r][c] == 1) {
                                  p.setColor(wallSide);
                                  canvas.drawRoundRect(tr, 6, 6, p);
                                  p.setColor(wallTop);
                                  canvas.drawRoundRect(new RectF(sx + 2, sy + 2, sx + tileW - 2, sy + tileH * 0.74f), 6, 6, p);
                              } else if (grid[r][c] == 5) {
                                  // 可用斬擊/脈衝震碎的裂縫秘寶牆
                                  p.setColor(Color.rgb(120, 53, 15));
                                  canvas.drawRoundRect(tr, 6, 6, p);
                                  strokeP.setColor(Color.rgb(251, 191, 36));
                                  strokeP.setStrokeWidth(2f);
                                  canvas.drawLine(sx + 8, sy + 8, sx + tileW - 8, sy + tileH - 8, strokeP);
                              } else if (grid[r][c] == 4) {
                                  // 星光靈草 (踩上自動回血)
                                  p.setColor((r + c) % 2 == 0 ? fl1 : fl2);
                                  canvas.drawRect(tr, p);
                                  p.setColor(Color.rgb(52, 211, 153));
                                  canvas.drawCircle(tr.centerX(), tr.centerY(), scale * 0.22f, p);
                                  p.setColor(Color.rgb(167, 243, 208));
                                  canvas.drawCircle(tr.centerX(), tr.centerY(), scale * 0.10f, p);
                              } else if (grid[r][c] == 2) {
                                  p.setColor(fl1);
                                  canvas.drawRect(tr, p);
                                  p.setColor(Color.rgb(168, 85, 247));
                                  p.setAlpha(140);
                                  canvas.drawOval(tr, p);
                                  p.setAlpha(255);
                              } else if (grid[r][c] == 3) {
                                  p.setColor(roadCol);
                                  canvas.drawRoundRect(tr, 4, 4, p);
                                  p.setColor(Color.argb(45, 255, 255, 255));
                                  canvas.drawCircle(tr.centerX(), tr.centerY(), 3.5f, p);
                              } else {
                                  p.setColor((r + c) % 2 == 0 ? fl1 : fl2);
                                  canvas.drawRect(tr, p);
                              }
                          }
                      }
          
                      // 繪製自動尋路目標準星
                      if (targetWalkX != -1 && targetWalkY != -1) {
                          float tx = mapX + (targetWalkX - camX + 0.5f) * tileW;
                          float ty = mapY + (targetWalkY - camY + 0.5f) * tileH;
                          strokeP.setColor(Color.rgb(52, 211, 153));
                          strokeP.setStrokeWidth(3f);
                          canvas.drawCircle(tx, ty, scale * (0.28f + 0.08f * (float)Math.sin(tick * 0.25f)), strokeP);
                      }
          
                      // 3. 繪製實體
                      p.setTextSize(Math.max(15f, tileH * 0.21f));
                      for (Entity e : entities) {
                          if (e.x < startC - 1 || e.x > endC + 1 || e.y < startR - 1 || e.y > endR + 1) continue;
                          float ecx = mapX + (e.renderX - camX + 0.5f) * tileW;
                          float ecy = mapY + (e.renderY - camY + 0.5f) * tileH;
                          drawDetailedEntity(canvas, e, ecx, ecy, scale);
          
                          String dispName = e.stunned ? "💫" + e.name : e.name;
                          float tw = p.measureText(dispName);
                          RectF tag = new RectF(ecx - tw / 2 - 8, ecy - scale * 0.75f, ecx + tw / 2 + 8, ecy - scale * 0.44f);
                          p.setColor(Color.argb(195, 9, 13, 22));
                          canvas.drawRoundRect(tag, 6, 6, p);
                          p.setColor("teleport".equals(e.type) ? Color.rgb(125, 211, 252)
                              : ("road_gate".equals(e.type) || "road_finish".equals(e.type) ? Color.rgb(253, 230, 138) : Color.WHITE));
                          canvas.drawText(dispName, ecx - tw / 2, tag.bottom - 5, p);
                      }
          
                      // 4. 繪製區網盟友與對話氣泡
                      if (isAllyOnline()) {
                          float acx = mapX + (ally.renderX - camX + 0.5f) * tileW;
                          float acy = mapY + (ally.renderY - camY + 0.5f) * tileH;
                          drawDetailedHero(canvas, acx, acy, scale, false, true);
                          String aTag = "🤝 Lv." + ally.level + " " + ally.name;
                          if (System.currentTimeMillis() - ally.bubbleTime < 6000 && !ally.chatBubble.isEmpty()) {
                              aTag = "💬 " + ally.chatBubble;
                          }
                          float atw = p.measureText(aTag);
                          RectF atRect = new RectF(acx - atw / 2 - 8, acy - scale * 0.82f, acx + atw / 2 + 8, acy - scale * 0.50f);
                          p.setColor(Color.argb(210, 6, 78, 59));
                          canvas.drawRoundRect(atRect, 6, 6, p);
                          p.setColor(Color.rgb(167, 243, 208));
                          canvas.drawText(aTag, acx - atw / 2, atRect.bottom - 5, p);
                      }
          
                      // 5. 繪製主角與衝擊波
                      float pcx = mapX + (renderPx - camX + 0.5f) * tileW;
                      float pcy = mapY + (renderPy - camY + 0.5f) * tileH;
                      if (shockwaveRadius > 0f) {
                          strokeP.setColor(Color.argb((int)Math.max(0, 255 - shockwaveRadius * 85), 56, 189, 248));
                          strokeP.setStrokeWidth(6f);
                          canvas.drawCircle(pcx, pcy, shockwaveRadius * scale, strokeP);
                          shockwaveRadius += 0.25f;
                          if (shockwaveRadius > 2.8f) shockwaveRadius = 0f;
                      }
                      drawDetailedHero(canvas, pcx, pcy, scale, worldFlags.contains("TAMED_SENTINEL"), false);
          
                      if (System.currentTimeMillis() - myBubbleTime < 5000 && !myChatBubble.isEmpty()) {
                          String bStr = "💬 " + myChatBubble;
                          float btw = p.measureText(bStr);
                          RectF bRect = new RectF(pcx - btw / 2 - 8, pcy - scale * 0.85f, pcx + btw / 2 + 8, pcy - scale * 0.52f);
                          p.setColor(Color.argb(210, 49, 46, 129));
                          canvas.drawRoundRect(bRect, 6, 6, p);
                          p.setColor(Color.WHITE);
                          canvas.drawText(bStr, pcx - btw / 2, bRect.bottom - 5, p);
                      }
          
                      // 6. 浮動跳字
                      for (int i = floatTexts.size() - 1; i >= 0; i--) {
                          FloatText ft = floatTexts.get(i);
                          float fx = mapX + (ft.gx - camX + 0.5f) * tileW;
                          float fy = mapY + (ft.gy - camY + 0.1f) * tileH + ft.offsetY;
                          p.setColor(ft.color);
                          p.setAlpha((int)(ft.alpha * 255));
                          float ftw = p.measureText(ft.text);
                          canvas.drawText(ft.text, fx - ftw / 2, fy, p);
                          ft.offsetY -= 1.5f;
                          ft.alpha -= 0.025f;
                          if (ft.alpha <= 0f) floatTexts.remove(i);
                      }
                      p.setAlpha(255);
          
                      // 7. 右上角小地圖 (Mini-Map)
                      float mmW = mapW * 0.25f, mmH = midH * 0.25f;
                      float mmX = mapX + mapW - mmW - 10, mmY = mapY + 10;
                      p.setColor(Color.argb(190, 9, 13, 22));
                      canvas.drawRoundRect(new RectF(mmX - 3, mmY - 3, mmX + mmW + 3, mmY + mmH + 3), 8, 8, p);
                      float mwCell = mmW / WORLD_COLS, mhCell = mmH / WORLD_ROWS;
                      for (int r = 0; r < WORLD_ROWS; r++) {
                          for (int c = 0; c < WORLD_COLS; c++) {
                              if (grid[r][c] == 1) p.setColor(Color.rgb(71, 85, 105));
                              else if (grid[r][c] == 3) p.setColor(Color.rgb(148, 163, 184));
                              else if (grid[r][c] == 4) p.setColor(Color.rgb(16, 185, 129));
                              else continue;
                              canvas.drawRect(mmX + c * mwCell, mmY + r * mhCell, mmX + (c + 1) * mwCell, mmY + (r + 1) * mhCell, p);
                          }
                      }
                      for (Entity e : entities) {
                          p.setColor("teleport".equals(e.type) ? Color.CYAN : ("road_gate".equals(e.type) || "road_finish".equals(e.type) ? Color.YELLOW : Color.RED));
                          canvas.drawCircle(mmX + (e.x + 0.5f) * mwCell, mmY + (e.y + 0.5f) * mhCell, 3.5f, p);
                      }
                      if (isAllyOnline()) {
                          p.setColor(Color.rgb(56, 189, 248));
                          canvas.drawCircle(mmX + (ally.x + 0.5f) * mwCell, mmY + (ally.y + 0.5f) * mhCell, 4.5f, p);
                      }
                      p.setColor(Color.GREEN);
                      canvas.drawCircle(mmX + (px + 0.5f) * mwCell, mmY + (py + 0.5f) * mhCell, 4.5f, p);
          
                      canvas.restore();
                      strokeP.setColor(runeCol);
                      strokeP.setStrokeWidth(2f);
                      canvas.drawRoundRect(new RectF(mapX, mapY, mapX + mapW, mapY + midH), 12, 12, strokeP);
          
                      // 8. 右側因果狀態與劇情面板
                      float sideX = mapX + mapW + 12;
                      float sideW = w - sideX - 12;
                      RectF sideRect = new RectF(sideX, mapY, sideX + sideW, mapY + midH);
                      p.setColor(Color.rgb(15, 23, 42));
                      canvas.drawRoundRect(sideRect, 14, 14, p);
                      strokeP.setColor(Color.rgb(79, 70, 229));
                      canvas.drawRoundRect(sideRect, 14, 14, strokeP);
          
                      float textY = mapY + 26;
                      float lineStep = Math.max(20f, h * 0.031f);
                      p.setTextSize(Math.max(15f, h * 0.022f));
                      p.setColor(Color.rgb(251, 191, 36));
                      textY = drawWrapped(canvas, "🎒 信物：" + inventory.toString(), sideX + 12, textY, sideW - 24, lineStep);
                      p.setColor(Color.rgb(56, 189, 248));
                      textY = drawWrapped(canvas, "⚖️ 生效因果：" + (worldFlags.isEmpty() ? "[初始狀態]" : worldFlags.toString()), sideX + 12, textY + 2, sideW - 24, lineStep);
          
                      p.setColor(Color.rgb(51, 65, 85));
                      canvas.drawLine(sideX + 10, textY + 4, sideX + sideW - 10, textY + 4, p);
                      textY += 14;
          
                      for (int i = Math.max(0, logs.size() - 5); i < logs.size(); i++) {
                          String entry = logs.get(i);
                          if (entry.startsWith("🎬") || entry.startsWith("🥾") || entry.startsWith("🎉")) p.setColor(Color.rgb(192, 132, 252));
                          else if (entry.startsWith("👉") || entry.startsWith("⚔️") || entry.startsWith("🤝") || entry.startsWith("🌟") || entry.startsWith("🗡️")) p.setColor(Color.rgb(52, 211, 153));
                          else p.setColor(Color.rgb(226, 232, 240));
                          textY = drawWrapped(canvas, entry, sideX + 12, textY, sideW - 24, lineStep) + 5;
                          if (textY > mapY + midH - 16) break;
                      }
          
                      // 9. 底部觸控按鈕列
                      float btnY = mapY + midH + 10;
                      float btnW = (w - 24 - 5 * 10) / 6f;
                      p.setTextSize(Math.max(17f, h * 0.026f));
                      for (int i = 0; i < 6; i++) {
                          float bx = 12 + i * (btnW + 10);
                          float byTop = (pressedBtn == i) ? btnY + 4 : btnY;
                          btnRects[i] = new RectF(bx, byTop, bx + btnW, h - 8);
                          if (i == 4) p.setColor(Color.rgb(79, 70, 229));
                          else if (i == 5) p.setColor(Color.rgb(14, 116, 144));
                          else p.setColor(Color.rgb(30, 41, 59));
                          canvas.drawRoundRect(btnRects[i], 14, 14, p);
                          strokeP.setColor(Color.rgb(129, 140, 248));
                          canvas.drawRoundRect(btnRects[i], 14, 14, strokeP);
                          p.setColor(Color.WHITE);
                          float bw = p.measureText(btnLabels[i]);
                          canvas.drawText(btnLabels[i], bx + (btnW - bw) / 2, byTop + (h - 8 - byTop) * 0.62f, p);
                      }
          
                      postInvalidateDelayed(33);
                  }
          
                  float drawWrapped(Canvas c, String text, float x, float y, float maxW, float lineH) {
                      String line = "";
                      for (int i = 0; i < text.length(); i++) {
                          char ch = text.charAt(i);
                          if (p.measureText(line + ch) <= maxW) {
                              line += ch;
                          } else {
                              c.drawText(line, x, y, p);
                              y += lineH;
                              line = String.valueOf(ch);
                          }
                      }
                      if (!line.isEmpty()) {
                          c.drawText(line, x, y, p);
                          y += lineH;
                      }
                      return y;
                  }
          
                  @Override
                  public boolean onTouchEvent(MotionEvent ev) {
                      float tx = ev.getX(), ty = ev.getY();
                      if (ev.getAction() == MotionEvent.ACTION_UP || ev.getAction() == MotionEvent.ACTION_CANCEL) {
                          pressedBtn = -1;
                          return true;
                      }
                      if (ev.getAction() != MotionEvent.ACTION_DOWN) return true;
          
                      if (inTitleScreen) {
                          for (int i = 0; i < 4; i++) {
                              if (titleBtns[i] != null && titleBtns[i].contains(tx, ty)) {
                                  if (i == 0) {
                                      resetNewGameData();
                                      inTitleScreen = false;
                                  } else if (i == 1) {
                                      openSaveLoadDialog(false);
                                  } else if (i == 2) {
                                      openLanDialog();
                                  } else if (i == 3) {
                                      openApiKeyDialog();
                                  }
                                  return true;
                              }
                          }
                          return true;
                      }
          
                      if (menuTopBtn.contains(tx, ty)) {
                          openSystemMenuDialog();
                          return true;
                      }
          
                      for (int i = 0; i < 6; i++) {
                          if (btnRects[i] != null && btnRects[i].contains(tx, ty)) {
                              pressedBtn = i;
                              lastHoldMoveTime = System.currentTimeMillis();
                              if (i == 0) movePlayer(-1, 0, true);
                              else if (i == 1) movePlayer(0, -1, true);
                              else if (i == 2) movePlayer(0, 1, true);
                              else if (i == 3) movePlayer(1, 0, true);
                              else if (i == 4) interactNearby();
                              else if (i == 5) performActionOrSkill();
                              return true;
                          }
                      }
                      int w = getWidth(), h = getHeight();
                      int topH = (int)(h * 0.12f), botH = (int)(h * 0.16f);
                      int midH = h - topH - botH - 18, mapW = (int)(w * 0.64f);
                      float mapX = 12, mapY = topH + 8;
                      if (tx >= mapX && tx <= mapX + mapW && ty >= mapY && ty <= mapY + midH) {
                          float tileW = mapW / VIEW_COLS, tileH = midH / VIEW_ROWS;
                          int gx = Math.max(0, Math.min(WORLD_COLS - 1, (int)(camX + (tx - mapX) / tileW)));
                          int gy = Math.max(0, Math.min(WORLD_ROWS - 1, (int)(camY + (ty - mapY) / tileH)));
                          if (gx == px && gy == py) {
                              interactNearby();
                          } else {
                              // 設定自動尋路目標，主角會自動一步步走過去！
                              targetWalkX = gx;
                              targetWalkY = gy;
                              stepAutoWalk();
                          }
                      }
                      return true;
                  }
              }
          }
          EOF_JAVA
          cp -f build_tmp/src/org/aether/rpg/MainActivity.java ./MainActivity.java
          fi

          cat << 'EOF' > build_tmp/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">星界迴響 2D</string>
          </resources>
          EOF

          cat << 'EOF' > build_tmp/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="org.aether.rpg"
              android:versionCode="5"
              android:versionName="5.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="@string/app_name"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          PLATFORM=$(ls -d "$ANDROID_HOME/platforms/android-"* | sort -V | tail -n 1)

          "$BUILD_TOOLS/aapt2" compile build_tmp/res/values/strings.xml -o build_tmp/compiled_res.zip
          "$BUILD_TOOLS/aapt2" link -o build_tmp/unsigned.apk -I "$PLATFORM/android.jar" --manifest build_tmp/AndroidManifest.xml -R build_tmp/compiled_res.zip --auto-add-overlay

          javac -encoding UTF-8 -source 8 -target 8 -cp "$PLATFORM/android.jar" -d build_tmp/obj build_tmp/src/org/aether/rpg/MainActivity.java
          "$BUILD_TOOLS/d8" --lib "$PLATFORM/android.jar" --output build_tmp build_tmp/obj/org/aether/rpg/*.class

          zip -uj build_tmp/unsigned.apk build_tmp/classes.dex
          "$BUILD_TOOLS/zipalign" -f 4 build_tmp/unsigned.apk build_tmp/aligned.apk

          keytool -genkeypair -v -keystore build_tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS/apksigner" sign --ks build_tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --out bin/gemini4-2d-rpg.apk build_tmp/aligned.apk
          rm -rf build_tmp

      - name: 4. 自動將 APK 放回專案首頁 (README 旁) 與 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -f bin/gemini4-2d-rpg.apk ./gemini4-2d-rpg.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f Mainactivity.java 2>/dev/null || true
          git add -f gemini4-2d-rpg.apk MainActivity.java
          git diff --staged --quiet || git commit -m "Auto-publish v5 gemini4-2d-rpg.apk & MainActivity.java [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 bin/gemini4-2d-rpg.apk \
