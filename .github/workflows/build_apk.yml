name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Native Android 2D RPG APK (v3 Large World & Causal AI Engine)
        run: |
          set -e
          rm -rf build_tmp
          mkdir -p build_tmp/src/org/aether/rpg build_tmp/res/values build_tmp/obj bin

          cat << 'EOF' > build_tmp/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">星界迴響 2D</string>
          </resources>
          EOF

          cat << 'EOF' > build_tmp/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="org.aether.rpg"
              android:versionCode="3"
              android:versionName="3.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > build_tmp/src/org/aether/rpg/MainActivity.java
          package org.aether.rpg;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.DialogInterface;
          import android.content.SharedPreferences;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RadialGradient;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.Random;

          public class MainActivity extends Activity {
              static class Choice {
                  String label, trait, item, log, reply;
                  String addFlag, removeFlag, requireFlag, forbidFlag;
                  int hp, mana, gold;
              }
              static class Entity {
                  String id, type, name, greeting, roleStyle;
                  int x, y;
                  boolean triggered = false;
                  ArrayList<Choice> choices = new ArrayList<Choice>();
              }
              static class FloatText {
                  String text;
                  float gx, gy, offsetY, alpha;
                  int color;
                  FloatText(String t, float x, float y, int c) {
                      text = t; gx = x; gy = y; offsetY = 0f; alpha = 1f; color = c;
                  }
              }
              static class Particle {
                  float rx, ry, vx, vy, size, alpha;
                  Particle(Random rnd) {
                      rx = rnd.nextFloat();
                      ry = rnd.nextFloat();
                      vx = (rnd.nextFloat() - 0.5f) * 0.0015f;
                      vy = -0.0007f - rnd.nextFloat() * 0.0012f;
                      size = 2.0f + rnd.nextFloat() * 4.0f;
                      alpha = 0.35f + rnd.nextFloat() * 0.65f;
                  }
              }

              // 24x14 大地圖網格與捲動鏡頭（視野顯示 11x6.5 格，保證角色精緻巨大且地圖廣闊）
              final int WORLD_COLS = 24, WORLD_ROWS = 14;
              final float VIEW_COLS = 10.5f, VIEW_ROWS = 6.2f;
              int[][] grid = new int[WORLD_ROWS][WORLD_COLS]; // 0:一般地磚, 1:高牆/山岩, 2:能量/危險地形, 3:古道石板路

              int zoneIndex = 1, hp = 110, maxHp = 130, mana = 40, maxMana = 100, gold = 60;
              String zoneTitle = "A區：遺落星門聖殿", biome = "ruins", trait = "星界旅人";
              boolean isRoadMap = false; // true 代表正在「區與區之間的徒步遠征古道」
              String lastTravelMethod = "INITIAL"; // "WALK_ROAD" 或 "TELEPORT"

              // 嚴格因果狀態旗標：決定哪些未來事件可以出現、哪些必須封鎖
              HashSet<String> worldFlags = new HashSet<String>();
              ArrayList<String> inventory = new ArrayList<String>();
              ArrayList<String> history = new ArrayList<String>();
              ArrayList<String> logs = new ArrayList<String>();
              ArrayList<Entity> entities = new ArrayList<Entity>();
              ArrayList<FloatText> floatTexts = new ArrayList<FloatText>();
              ArrayList<Particle> particles = new ArrayList<Particle>();

              int px = 3, py = 7;
              float renderPx = 3f, renderPy = 7f;
              float camX = 0f, camY = 0f;
              int facingX = 1, facingY = 0;
              float walkCycle = 0f;

              boolean isGenerating = false;
              String apiKey = "";
              JSONObject pendingNextZoneData = null;
              GameView gameView;
              Random rnd = new Random();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  SharedPreferences sp = getSharedPreferences("gemini4_rpg_v3", Context.MODE_PRIVATE);
                  apiKey = sp.getString("api_key", "");
                  for (int i = 0; i < 35; i++) particles.add(new Particle(rnd));
                  inventory.add("古舊星盤");
                  history.add("在 A區「遺落星門聖殿」甦醒。");
                  addLog("🌟 歡迎來到《星界迴響》大世界因果版！");
                  addLog("🗺️ 前往下一區有兩種方式：走東側「🚪邊境古道口」需親自走過荒野古道（途中可能遭遇伏擊事件）；走北側「🔮古代傳送陣」需消耗 25 共鳴，可安全直達下一區！");
                  initZone1();
                  gameView = new GameView(this);
                  setContentView(gameView);
              }

              void addLog(String s) {
                  logs.add(s);
                  if (logs.size() > 8) logs.remove(0);
              }

              void spawnFloat(String text, float x, float y, int color) {
                  floatTexts.add(new FloatText(text, x, y, color));
              }

              boolean checkChoiceAllowed(Choice c) {
                  if (c.requireFlag != null && !c.requireFlag.isEmpty() && !worldFlags.contains(c.requireFlag)) {
                      return false;
                  }
                  if (c.forbidFlag != null && !c.forbidFlag.isEmpty() && worldFlags.contains(c.forbidFlag)) {
                      return false;
                  }
                  return true;
              }

              // ==================== 建立 A 區：24x14 大地圖 ====================
              void initZone1() {
                  isRoadMap = false;
                  for (int r = 0; r < WORLD_ROWS; r++) {
                      for (int c = 0; c < WORLD_COLS; c++) {
                          if (r == 0 || r == WORLD_ROWS - 1 || c == 0 || c == WORLD_COLS - 1) grid[r][c] = 1;
                          else if (r == 7 && c >= 2 && c <= 22) grid[r][c] = 3; // 中央主幹石板古道
                          else if (c == 14 && r >= 2 && r <= 7) grid[r][c] = 3; // 通往北側傳送陣的支道
                          else grid[r][c] = 0;
                      }
                  }
                  // 遺跡石牆群與能量水池
                  int[][] walls = {
                      {6,2},{6,3},{6,4},{6,9},{6,10},{6,11},
                      {11,2},{11,3},{11,10},{11,11},
                      {17,4},{17,5},{17,9},{17,10}
                  };
                  for (int[] w : walls) grid[w[1]][w[0]] = 1;
                  int[][] pools = {{8,4},{9,4},{8,10},{9,10},{18,3},{19,3}};
                  for (int[] p : pools) grid[p[1]][p[0]] = 2;

                  px = 3; py = 7; renderPx = 3f; renderPy = 7f;
                  entities.clear();

                  // 1. 守門人艾琳（決定村莊與星門命運）
                  Entity elaine = new Entity();
                  elaine.id = "npc_elaine"; elaine.type = "npc"; elaine.roleStyle = "mage";
                  elaine.name = "守門人艾琳"; elaine.x = 5; elaine.y = 6;
                  elaine.greeting = "「旅人，東邊古道通往未知的邊境，北邊則有古代傳送陣。但目前星門結界不穩，你要如何處置手上的古舊星盤？」";

                  Choice ec1 = new Choice();
                  ec1.label = "🛡️ 注入能量加固村莊結界（共鳴-10，獲「守護紋章」與巡守隊支援）";
                  ec1.mana = -10; ec1.trait = "仁慈守護者"; ec1.item = "守護紋章";
                  ec1.addFlag = "PROTECTED_VILLAGE"; ec1.removeFlag = "OVERLOADED_GATE";
                  ec1.log = "加固村莊結界，與守門人結盟並獲得守護紋章。";
                  ec1.reply = "艾琳感激地行禮：「巡守隊已經收到訊號，你在後續區域將獲得我們的庇護！」";

                  Choice ec2 = new Choice();
                  ec2.label = "⚡ 強行抽取結界能量充能（共鳴+35，獲「超載核心」，但引來星界追獵者）";
                  ec2.mana = 35; ec2.trait = "狂熱求知者"; ec2.item = "超載核心";
                  ec2.addFlag = "OVERLOADED_GATE"; ec2.removeFlag = "PROTECTED_VILLAGE";
                  ec2.log = "強行抽乾村莊結界取得超載核心，引發星界警報。";
                  ec2.reply = "結界碎裂！艾琳臉色蒼白：「你雖然拿到龐大共鳴，但古道上的異獸與追獵者已經鎖定你了！」";

                  elaine.choices.add(ec1); elaine.choices.add(ec2);
                  entities.add(elaine);

                  // 2. 遺跡軍械寶箱
                  Entity chest = new Entity();
                  chest.id = "chest_armory"; chest.type = "chest";
                  chest.name = "皇家符文寶箱"; chest.x = 9; chest.y = 3;
                  chest.greeting = "上鎖的古老符文寶箱，散發著星界波動。";
                  Choice cc1 = new Choice();
                  cc1.label = "🔓 用星盤精準解鎖（星幣+50，獲「星界傳送符」）";
                  cc1.gold = 50; cc1.item = "星界傳送符"; cc1.addFlag = "HAS_TELEPORT_RUNE";
                  cc1.log = "解開皇家符文寶箱，取得星界傳送符與 50 星幣。";
                  cc1.reply = "你獲得了「星界傳送符」，啟動北側傳送陣時將不需消耗自身共鳴！";
                  Choice cc2 = new Choice();
                  cc2.label = "🔨 暴力劈開寶箱（HP-10，星幣+85）";
                  cc2.hp = -10; cc2.gold = 85; cc2.trait = "果斷掠奪者"; cc2.addFlag = "LOOTED_BY_FORCE";
                  cc2.log = "暴力劈開寶箱奪取 85 星幣，但損毀了裡面的精緻符文。";
                  cc2.reply = "符文碎裂震傷了你的手，但你搜刮了滿滿一袋星幣！";
                  chest.choices.add(cc1); chest.choices.add(cc2);
                  entities.add(chest);

                  // 3. 鎮守古道的失控機甲哨兵
                  Entity sentinel = new Entity();
                  sentinel.id = "mob_sentinel"; sentinel.type = "monster"; sentinel.roleStyle = "mecha";
                  sentinel.name = "重裝星界哨兵"; sentinel.x = 15; sentinel.y = 8;
                  sentinel.greeting = "重裝星界哨兵展開雙肩離子砲：「警告—偵測到通行者，請證明權限或接受殲滅！」";

                  Choice mc1 = new Choice();
                  mc1.label = "⚔️ 揮劍斬斷核心徹底摧毀它（HP-15，星幣+60，獲「哨兵殘骸核心」）";
                  mc1.hp = -15; mc1.gold = 60; mc1.item = "哨兵殘骸核心"; mc1.trait = "鋼鐵破壞者";
                  mc1.addFlag = "DESTROYED_SENTINEL"; mc1.removeFlag = "TAMED_SENTINEL";
                  mc1.log = "徹底斬毀了重裝星界哨兵，觸發機械中樞的復仇協定。";
                  mc1.reply = "哨兵爆炸倒地，但死前向下一區發出了「機械復仇追殺令」！";

                  Choice mc2 = new Choice();
                  mc2.label = "🔧 用星盤改寫晶片收服為隨身夥伴（共鳴-15，獲「浮游機甲夥伴」）";
                  mc2.mana = -15; mc2.item = "浮游機甲夥伴"; mc2.trait = "機械統御者";
                  mc2.addFlag = "TAMED_SENTINEL"; mc2.removeFlag = "DESTROYED_SENTINEL";
                  mc2.log = "成功改寫哨兵晶片，收服為隨身浮游機甲夥伴。";
                  mc2.reply = "哨兵化為小型浮游機甲跟隨在你身後：「主人，護衛模式已啟動！」";

                  sentinel.choices.add(mc1); sentinel.choices.add(mc2);
                  entities.add(sentinel);

                  // 4. 北側：🔮 古代傳送陣（免除古道襲擊，直接傳送至下一區）
                  Entity telePad = new Entity();
                  telePad.id = "exit_teleport"; telePad.type = "teleport";
                  telePad.name = "🔮 古代傳送陣(安全直達)"; telePad.x = 14; telePad.y = 2;
                  entities.add(telePad);

                  // 5. 東側：🚪 邊境古道口（需親自走過遠征古道，途中會有襲擊事件）
                  Entity roadGate = new Entity();
                  roadGate.id = "exit_road"; roadGate.type = "road_gate";
                  roadGate.name = "🚪 邊境古道(徒步前往下一區)"; roadGate.x = 22; roadGate.y = 7;
                  entities.add(roadGate);
              }

              // ==================== 徒步遠征古道地圖（玩家必須親自走過去，途中觸發襲擊） ====================
              void startRoadExpedition() {
                  isRoadMap = true;
                  lastTravelMethod = "WALK_ROAD";
                  for (int r = 0; r < WORLD_ROWS; r++) {
                      for (int c = 0; c < WORLD_COLS; c++) {
                          if (r < 4 || r > 9 || c == 0 || c == WORLD_COLS - 1) grid[r][c] = 1; // 峽谷兩側山壁
                          else if (r == 6 || r == 7) grid[r][c] = 3; // 峽谷中央古道
                          else grid[r][c] = 0;
                      }
                  }
                  grid[5][9] = 2; grid[8][15] = 2;
                  px = 2; py = 7; renderPx = 2f; renderPy = 7f;
                  entities.clear();

                  // 根據玩家先前的因果旗標，決定古道上的攔路事件（嚴格符合先前行動）
                  Entity ambush1 = new Entity();
                  ambush1.id = "road_ambush_1"; ambush1.type = "monster"; ambush1.x = 10; ambush1.y = 7;
                  if (worldFlags.contains("OVERLOADED_GATE")) {
                      ambush1.name = "裂隙噬星獵犬"; ambush1.roleStyle = "beast";
                      ambush1.greeting = "因為你先前強行超載了星門，被能量吸引的「裂隙噬星獵犬」在古道半路撲向你！";
                      Choice a1 = new Choice();
                      a1.label = "⚡ 引爆「超載核心」震退獵犬（共鳴-15，HP-5，獲「獵犬星牙」）";
                      a1.mana = -15; a1.hp = -5; a1.item = "獵犬星牙";
                      a1.log = "在徒步古道遭遇因超載引來的噬星獵犬，引爆能量將其擊退。";
                      a1.reply = "狂暴的星界衝擊波震飛了獵犬，你得以繼續前行！";
                      ambush1.choices.add(a1);
                  } else {
                      ambush1.name = "荒野劫掠團伏兵"; ambush1.roleStyle = "bandit";
                      ambush1.greeting = "你選擇徒步走過邊境古道，埋伏在峽谷兩側的「荒野劫掠團」跳出來攔住了去路：「留下買路財！」";
                      Choice a1 = new Choice();
                      a1.label = "⚔️ 拔劍正面擊潰劫掠團（HP-12，奪回星幣+45）";
                      a1.hp = -12; a1.gold = 45; a1.addFlag = "DEFEATED_ROAD_BANDITS";
                      a1.log = "徒步古道遭遇劫掠團伏擊，正面將其擊潰。";
                      a1.reply = "劫掠團見你劍術凌厲，丟下贓物狼狽逃竄！";
                      ambush1.choices.add(a1);
                  }

                  // 若玩家收服了機械夥伴，自動多出一個「派遣機甲夥伴無傷掃蕩」的專屬因果選項！
                  if (worldFlags.contains("TAMED_SENTINEL")) {
                      Choice droneOpt = new Choice();
                      droneOpt.label = "🤖 【機甲夥伴專屬】派隨身浮游機甲發射雷射掃蕩（無傷通過，星幣+40）";
                      droneOpt.gold = 40;
                      droneOpt.log = "在古道遭遇襲擊時，派出先前收服的浮游機甲無傷解決敵人。";
                      droneOpt.reply = "身後的浮游機甲精準鎖定目標，一發離子光束瞬間清空了道路！";
                      ambush1.choices.add(droneOpt);
                  }
                  entities.add(ambush1);

                  // 第二段古道事件（x=17）
                  Entity ambush2 = new Entity();
                  ambush2.id = "road_ambush_2"; ambush2.x = 17; ambush2.y = 6;
                  if (worldFlags.contains("DESTROYED_SENTINEL")) {
                      ambush2.type = "monster"; ambush2.roleStyle = "mecha";
                      ambush2.name = "復仇者追獵機兵";
                      ambush2.greeting = "「偵測到摧毀哨兵之兇手——執行抹殺！」因為你先前摧毀了哨兵，追兵在古道後半段攔截了你！";
                      Choice b1 = new Choice();
                      b1.label = "⚔️ 苦戰突圍（HP-18，星幣+55，獲「高階裝甲片」）";
                      b1.hp = -18; b1.gold = 55; b1.item = "高階裝甲片";
                      b1.log = "在古道擊退了因摧毀哨兵而來的復仇追獵機兵。";
                      b1.reply = "你冒著砲火斬斷追兵機翼，終於看見前方的區域大門！";
                      ambush2.choices.add(b1);
                  } else if (worldFlags.contains("PROTECTED_VILLAGE")) {
                      ambush2.type = "npc"; ambush2.roleStyle = "ranger";
                      ambush2.name = "邊境巡守隊長";
                      ambush2.greeting = "「原來是保護了星門村莊的恩人！古道後半段已被我們肅清，這是給你的遠征補給。」";
                      Choice b1 = new Choice();
                      b1.label = "💚 接受巡守隊補給（HP+25，共鳴+15）";
                      b1.hp = 25; b1.mana = 15;
                      b1.log = "因先前保護村莊，在古道獲得巡守隊長的醫療補給。";
                      b1.reply = "你的體力充沛地恢復了，前方就是下一區的入口！";
                      ambush2.choices.add(b1);
                  } else {
                      ambush2.type = "monster"; ambush2.roleStyle = "beast";
                      ambush2.name = "古道迷霧魔狼";
                      ambush2.greeting = "古道終點前，一頭飢餓的迷霧魔狼正擋在路中央低吼！";
                      Choice b1 = new Choice();
                      b1.label = "🗡️ 迎戰擊退魔狼（HP-10，星幣+30）";
                      b1.hp = -10; b1.gold = 30;
                      b1.log = "在古道終點前擊退迷霧魔狼。";
                      b1.reply = "魔狼哀嚎一聲退入迷霧中，前方的區域大門就在眼前！";
                      ambush2.choices.add(b1);
                  }
                  entities.add(ambush2);

                  // 古道最右側：真正抵達下一區的入口大門
                  Entity destGate = new Entity();
                  destGate.id = "road_finish"; destGate.type = "road_finish";
                  destGate.name = "🏰 抵達下一區入口"; destGate.x = 22; destGate.y = 7;
                  entities.add(destGate);

                  addLog("🥾 【徒步遠征古道】請操作主角向右走過這條峽谷古道前往下一區（小心途中的攔路事件）！");
                  spawnFloat("🥾 開始徒步遠征！", px, py, Color.rgb(251, 191, 36));
              }

              // ==================== 玩家移動與距離自動伏擊判定 ====================
              void movePlayer(int dx, int dy) {
                  if (isGenerating) return;
                  facingX = dx != 0 ? dx : facingX;
                  facingY = dy != 0 ? dy : facingY;
                  walkCycle += 1.2f;

                  int nx = px + dx, ny = py + dy;
                  if (nx < 0 || nx >= WORLD_COLS || ny < 0 || ny >= WORLD_ROWS || grid[ny][nx] == 1) {
                      spawnFloat("受阻", nx, ny, Color.rgb(148, 163, 184));
                      return;
                  }
                  for (Entity e : entities) {
                      if (e.x == nx && e.y == ny) {
                          interactEntity(e);
                          return;
                      }
                  }
                  px = nx; py = ny;
                  if (grid[ny][nx] == 2) {
                      hp = Math.max(1, hp - 2);
                      spawnFloat("-2 HP 能量侵蝕", px, py, Color.rgb(244, 63, 94));
                  }

                  // 若在徒步古道上，靠近敵人 1 格內會自動觸發伏擊攔截（不能無視敵人直接繞過去）
                  if (isRoadMap) {
                      for (Entity e : entities) {
                          if ("monster".equals(e.type) && !e.triggered && Math.abs(e.x - px) <= 1 && Math.abs(e.y - py) <= 1) {
                              e.triggered = true;
                              spawnFloat("⚠️ 遭遇襲擊！", px, py, Color.rgb(244, 63, 94));
                              interactEntity(e);
                              break;
                          }
                      }
                  }
              }

              void interactNearby() {
                  for (Entity e : entities) {
                      if (Math.abs(e.x - px) + Math.abs(e.y - py) <= 1) {
                          interactEntity(e);
                          return;
                      }
                  }
                  spawnFloat("請先靠近目標", px, py, Color.rgb(203, 213, 225));
              }

              void interactEntity(final Entity e) {
                  if ("teleport".equals(e.type)) {
                      handleTeleportChoice();
                      return;
                  }
                  if ("road_gate".equals(e.type)) {
                      new AlertDialog.Builder(this)
                          .setTitle("🚪 邊境古道口（徒步前往下一區）")
                          .setMessage("走古道不需消耗共鳴能量，但你必須親自操作角色走過荒野峽谷，且途中可能會根據你先前的所作所為遭遇伏擊事件。\n\n確定要徒步踏上古道嗎？")
                          .setPositiveButton("🥾 踏上古道（親自走過去）", new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface d, int w) {
                                  startRoadExpedition();
                              }
                          })
                          .setNegativeButton("暫留本區", null)
                          .show();
                      return;
                  }
                  if ("road_finish".equals(e.type)) {
                      triggerAutoCausalNextZone("WALK_ROAD", "");
                      return;
                  }

                  // 過濾出符合當前世界旗標 (worldFlags) 的合法選項，矛盾選項絕不出現
                  final ArrayList<Choice> validChoices = new ArrayList<Choice>();
                  for (Choice ch : e.choices) {
                      if (checkChoiceAllowed(ch)) validChoices.add(ch);
                  }

                  AlertDialog.Builder b = new AlertDialog.Builder(this);
                  b.setTitle("💬 " + e.name + "：" + e.greeting);
                  String[] items = new String[validChoices.size() + 1];
                  for (int i = 0; i < validChoices.size(); i++) items[i] = validChoices.get(i).label;
                  items[validChoices.size()] = "✨ 輸入自訂行動（系統將自動推演因果）...";
                  b.setItems(items, new DialogInterface.OnClickListener() {
                      @Override
                      public void onClick(DialogInterface d, int which) {
                          if (which < validChoices.size()) {
                              applyChoice(e, validChoices.get(which));
                          } else {
                              promptCustomAction(e);
                          }
                      }
                  });
                  if (!isRoadMap || !"monster".equals(e.type)) {
                      b.setNegativeButton("關閉", null);
                  }
                  b.show();
              }

              void handleTeleportChoice() {
                  final boolean hasRune = worldFlags.contains("HAS_TELEPORT_RUNE") || inventory.contains("星界傳送符");
                  String msg = hasRune
                      ? "你持有「星界傳送符」，可免費啟動傳送陣！\n傳送將直接跨越荒野峽谷安全抵達下一區，完全不會遭遇古道伏擊事件。"
                      : "啟動古代傳送陣需要消耗 25 點共鳴（目前共鳴：" + mana + "）。\n傳送可安全直達下一區，免去徒步走古道遭遇襲擊的麻煩！";

                  new AlertDialog.Builder(this)
                      .setTitle("🔮 古代傳送星陣")
                      .setMessage(msg)
                      .setPositiveButton(hasRune ? "✨ 使用傳送符安全傳送" : "🔮 消耗 25 共鳴安全傳送", new DialogInterface.OnClickListener() {
                          @Override
                          public void onClick(DialogInterface d, int w) {
                              if (!hasRune && mana < 25) {
                                  Toast.makeText(MainActivity.this, "共鳴不足 25 點！請先探索地圖或改走東側「🚪邊境古道」徒步前往。", Toast.LENGTH_LONG).show();
                                  return;
                              }
                              if (!hasRune) mana -= 25;
                              lastTravelMethod = "TELEPORT";
                              worldFlags.add("USED_SAFE_TELEPORT");
                              history.add("啟動古代傳送陣，避開荒野古道安全傳送至下一區。");
                              spawnFloat("🔮 空間傳送啟動！", px, py, Color.rgb(56, 189, 248));
                              triggerAutoCausalNextZone("TELEPORT", "");
                          }
                      })
                      .setNegativeButton("取消", null)
                      .show();
              }

              void applyChoice(Entity e, Choice c) {
                  hp = Math.max(1, Math.min(maxHp, hp + c.hp));
                  mana = Math.max(0, Math.min(maxMana, mana + c.mana));
                  gold = Math.max(0, gold + c.gold);
                  if (c.hp != 0) spawnFloat((c.hp > 0 ? "+" : "") + c.hp + " HP", px, py, c.hp > 0 ? Color.rgb(52, 211, 153) : Color.rgb(251, 113, 133));
                  if (c.mana != 0) spawnFloat((c.mana > 0 ? "+" : "") + c.mana + " 共鳴", px, py - 0.4f, Color.rgb(129, 140, 248));
                  if (c.trait != null && !c.trait.isEmpty()) trait = c.trait;
                  if (c.addFlag != null && !c.addFlag.isEmpty()) worldFlags.add(c.addFlag);
                  if (c.removeFlag != null && !c.removeFlag.isEmpty()) worldFlags.remove(c.removeFlag);
                  if (c.item != null && !c.item.isEmpty() && !inventory.contains(c.item)) {
                      inventory.add(c.item);
                      spawnFloat("獲得 " + c.item, e.x, e.y, Color.rgb(251, 191, 36));
                  }
                  history.add("第" + zoneIndex + "區：" + c.log);
                  addLog("👉 " + c.log);
                  if (c.reply != null && !c.reply.isEmpty()) addLog("💬 " + c.reply);
                  if ("chest".equals(e.type) || "monster".equals(e.type) || isRoadMap) {
                      entities.remove(e);
                  }
              }

              void promptCustomAction(final Entity e) {
                  final EditText et = new EditText(this);
                  et.setHint("輸入你對 " + e.name + " 的行動（系統將自動判斷後續因果）...");
                  new AlertDialog.Builder(this)
                      .setTitle("⚡ 自由行動（自動因果判定）")
                      .setView(et)
                      .setPositiveButton("執行行動", new DialogInterface.OnClickListener() {
                          @Override
                          public void onClick(DialogInterface d, int w) {
                              String act = et.getText().toString().trim();
                              if (!act.isEmpty()) {
                                  evaluateCustomActionCausality(e, act);
                              }
                          }
                      })
                      .setNegativeButton("取消", null)
                      .show();
              }

              void evaluateCustomActionCausality(Entity e, String act) {
                  // 自動根據關鍵字更新世界因果旗標，排除矛盾未來事件
                  if (act.contains("殺") || act.contains("斬") || act.contains("毀") || act.contains("攻擊") || act.contains("搶")) {
                      worldFlags.add("HOSTILE_ACTION_" + e.id);
                      worldFlags.add("RUTHLESS_PATH");
                      worldFlags.remove("PEACEFUL_PATH");
                      trait = "冷酷破局者";
                      gold += 40;
                      hp = Math.max(1, hp - 10);
                      entities.remove(e);
                      addLog("⚔️ 你對「" + e.name + "」採取了強硬手段：「" + act + "」！該角色已從世界消失，後續將不會再出現其友好事件，並會引來敵對勢力警戒。");
                  } else if (act.contains("幫") || act.contains("救") || act.contains("治") || act.contains("送") || act.contains("結盟") || act.contains("收服")) {
                      worldFlags.add("ALLIED_WITH_" + e.id);
                      worldFlags.add("PEACEFUL_PATH");
                      if ("mob_sentinel".equals(e.id)) worldFlags.add("TAMED_SENTINEL");
                      trait = "星界締結者";
                      mana = Math.min(maxMana, mana + 15);
                      if ("monster".equals(e.type)) entities.remove(e);
                      addLog("🤝 你對「" + e.name + "」採取了結盟行動：「" + act + "」！已鎖定友好因果線，排除後續與其敵對的矛盾事件。");
                  } else {
                      worldFlags.add("CUSTOM_ACT_" + e.id);
                      mana = Math.min(maxMana, mana + 10);
                      trait = "奇策探索者";
                      if (isRoadMap) entities.remove(e);
                      addLog("✨ 你對「" + e.name + "」執行了：「" + act + "」，世界因果線已自動調整！");
                  }
                  history.add("第" + zoneIndex + "區自訂行動：對 " + e.name + "「" + act + "」");
                  spawnFloat("⚖️ 因果線已更新", px, py, Color.rgb(56, 189, 248));
              }

              // ==================== 嚴格因果檢核與自動生成下一區 ====================
              void triggerAutoCausalNextZone(final String travelMode, final String extraNote) {
                  if (isGenerating) return;
                  isGenerating = true;
                  addLog("⏳ 正在根據你的行動旗標 " + worldFlags.toString() + " 與移動方式（" + ("TELEPORT".equals(travelMode) ? "安全傳送" : "徒步遠征") + "）自動推演下一區...");

                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          JSONObject result = null;
                          if (apiKey != null && !apiKey.isEmpty()) {
                              try {
                                  result = callGemini4CausalZone(travelMode, extraNote);
                              } catch (Exception ex) {
                                  final String msg = ex.getMessage();
                                  runOnUiThread(new Runnable() {
                                      @Override
                                      public void run() {
                                          addLog("⚠️ 雲端提示 (" + msg + ")，已由本機因果檢核引擎自動生成！");
                                      }
                                  });
                              }
                          }
                          final JSONObject finalData = (result != null) ? result : buildCausalLocalZone(travelMode);
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  applyNewZone(finalData, travelMode);
                                  isGenerating = false;
                              }
                          });
                      }
                  }).start();
              }

              JSONObject callGemini4CausalZone(String travelMode, String extraNote) throws Exception {
                  int nextNum = zoneIndex + 1;
                  String prompt = "你是 2D 遊戲《星界迴響》的「因果律檢核與劇本生成引擎」。請為玩家生成第 " + nextNum + " 區。"
                      + "\n【硬性因果法則】"
                      + "\n1. 玩家已觸發的世界旗標：" + worldFlags.toString()
                      + "\n2. 玩家完整行動紀錄：" + history.toString()
                      + "\n3. 玩家進入本區的方式：" + ("TELEPORT".equals(travelMode) ? "透過古代傳送陣安全直達（未經古道）" : "親自徒步走過荒野古道並突破沿途伏擊抵達")
                      + "\n4. 玩家持有道具：" + inventory.toString() + "，傾向：" + trait
                      + "\n5. 嚴格排除任何與上述旗標矛盾的事件（例如：若已摧毀哨兵 DESTROYED_SENTINEL，絕不能出現哨兵友善協助；若已收服哨兵 TAMED_SENTINEL，必須提供利用機甲夥伴的專屬選擇；若已保護村莊 PROTECTED_VILLAGE，應出現盟友接應而非村莊毀滅）。"
                      + "\n請只回傳純 JSON 物件：{\"zoneTitle\":\"區域名稱\",\"biome\":\"forest或cyber或volcano或ruins\",\"openingNarration\":\"明確指出玩家是傳送還是徒步抵達、並呼應先前旗標的開場白(60字內)\",\"npcName\":\"符合因果的新NPC\",\"npcRole\":\"mage或ranger或mecha\",\"npcGreeting\":\"明確提到玩家上一區具體行為的台詞\",\"choice1Label\":\"符合當前狀態的選擇1\",\"choice1Item\":\"新道具\",\"choice1Flag\":\"NEW_FLAG_1\",\"choice1Reply\":\"回應1\",\"choice2Label\":\"符合當前狀態的選擇2\",\"choice2Flag\":\"NEW_FLAG_2\",\"choice2Reply\":\"回應2\",\"chestName\":\"寶箱名\",\"chestItem\":\"寶物名\",\"mobName\":\"符合因果的強敵名\",\"mobRole\":\"mecha或beast或bandit\",\"mobGreeting\":\"強敵台詞\",\"mobChoice1\":\"迎戰選項\",\"mobChoice2\":\"符合玩家持有道具的智取選項\"}";

                  URL url = new URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-4-argon:generateContent");
                  HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                  conn.setConnectTimeout(15000);
                  conn.setReadTimeout(20000);
                  conn.setRequestMethod("POST");
                  conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                  conn.setRequestProperty("x-goog-api-key", apiKey);
                  conn.setDoOutput(true);

                  JSONObject reqBody = new JSONObject();
                  JSONArray contents = new JSONArray();
                  JSONObject partObj = new JSONObject().put("text", prompt);
                  contents.put(new JSONObject().put("parts", new JSONArray().put(partObj)));
                  reqBody.put("contents", contents);
                  reqBody.put("generationConfig", new JSONObject().put("responseMimeType", "application/json"));

                  OutputStream os = conn.getOutputStream();
                  os.write(reqBody.toString().getBytes("UTF-8"));
                  os.close();

                  BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), "UTF-8"));
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = br.readLine()) != null) sb.append(line);
                  br.close();

                  JSONObject respJson = new JSONObject(sb.toString());
                  String raw = respJson.getJSONArray("candidates").getJSONObject(0)
                      .getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text");
                  raw = raw.replace("```json", "").replace("```", "").trim();
                  return new JSONObject(raw);
              }

