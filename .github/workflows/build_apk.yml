name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 檢出專案檔案 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 設定 Java 17 編譯環境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 產生 Android 設定檔並編譯簽署 APK
        run: |
          set -e
          rm -rf build_tmp
          mkdir -p build_tmp/src/org/aether/rpg build_tmp/res/values build_tmp/obj bin

          JAVA_SRC=$(find . -maxdepth 2 -iname "mainactivity*.java" | head -n 1)
          if [ -n "$JAVA_SRC" ] && grep -q "targetWalkX" "$JAVA_SRC"; then
            echo "使用專案內的最新版 v5 $JAVA_SRC"
            python3 -c '
          import sys, pathlib
          txt = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          parts = txt.split("package org.aether.rpg;")
          if len(parts) > 2:
              txt = "package org.aether.rpg;" + parts[1]
          pathlib.Path("build_tmp/src/org/aether/rpg/MainActivity.java").write_text(txt, encoding="utf-8")
          ' "$JAVA_SRC"
          else
            echo "自動升級專案內的 MainActivity.java 為 v5 完整版..."
            cat << 'EOF_JAVA' > build_tmp/src/org/aether/rpg/MainActivity.java
          package org.aether.rpg;
          
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.DialogInterface;
          import android.content.SharedPreferences;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RadialGradient;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.DatagramPacket;
          import java.net.DatagramSocket;
          import java.net.HttpURLConnection;
          import java.net.Inet4Address;
          import java.net.InetAddress;
          import java.net.InetSocketAddress;
          import java.net.NetworkInterface;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.Enumeration;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Random;
          
          public class MainActivity extends Activity {
              static class Choice {
                  String label, trait, item, log, reply;
                  String addFlag, removeFlag, requireFlag, forbidFlag;
                  int hp, mana, gold, exp;
              }
              static class Entity {
                  String id, type, name, greeting, roleStyle;
                  int x, y, homeX, homeY, patrolRange = 0;
                  float renderX, renderY;
                  boolean triggered = false;
                  boolean stunned = false; // 被玩家的星輝斬或星盤脈衝先手擊暈/破甲
                  ArrayList<Choice> choices = new ArrayList<Choice>();
                  Entity(String id, String type, String name, int x, int y) {
                      this.id = id; this.type = type; this.name = name;
                      this.x = x; this.y = y; this.homeX = x; this.homeY = y;
                      this.renderX = x; this.renderY = y;
                  }
              }
              static class FloatText {
                  String text;
                  float gx, gy, offsetY, alpha;
                  int color;
                  FloatText(String t, float x, float y, int c) {
                      text = t; gx = x; gy = y; offsetY = 0f; alpha = 1f; color = c;
                  }
              }
              static class Particle {
                  float rx, ry, vx, vy, size, alpha;
                  Particle(Random rnd) {
                      rx = rnd.nextFloat();
                      ry = rnd.nextFloat();
                      vx = (rnd.nextFloat() - 0.5f) * 0.0015f;
                      vy = -0.0007f - rnd.nextFloat() * 0.0012f;
                      size = 2.0f + rnd.nextFloat() * 4.0f;
                      alpha = 0.35f + rnd.nextFloat() * 0.65f;
                  }
              }
              static class RemotePeer {
                  String name = "星界盟友";
                  String ip = "";
                  int x = 4, y = 7, zone = 1, hp = 100, level = 1;
                  float renderX = 4f, renderY = 7f;
                  String chatBubble = "";
                  long bubbleTime = 0;
                  long lastSeen = 0;
              }
          
              boolean inTitleScreen = true;
          
              // 24x14 大世界網格：0=地板, 1=石牆, 2=能量陷阱, 3=古道石板, 4=星光靈草(可採集回血), 5=裂縫密室牆(可用脈衝震碎)
              final int WORLD_COLS = 24, WORLD_ROWS = 14;
              final float VIEW_COLS = 10.5f, VIEW_ROWS = 6.2f;
              int[][] grid = new int[WORLD_ROWS][WORLD_COLS];
          
              // 完整 RPG 成長與裝備數值
              int zoneIndex = 1, level = 1, exp = 0, nextExp = 100;
              int hp = 120, maxHp = 120, mana = 50, maxMana = 100, gold = 80;
              int atk = 15, def = 5;
              String playerName = "星輝劍士";
              String myChatBubble = "";
              long myBubbleTime = 0;
              String zoneTitle = "A區：遺落星門聖殿", biome = "ruins", trait = "星界旅人";
              boolean isRoadMap = false;
          
              HashSet<String> worldFlags = new HashSet<String>();
              ArrayList<String> inventory = new ArrayList<String>();
              ArrayList<String> history = new ArrayList<String>();
              ArrayList<String> logs = new ArrayList<String>();
              ArrayList<Entity> entities = new ArrayList<Entity>();
              ArrayList<FloatText> floatTexts = new ArrayList<FloatText>();
              ArrayList<Particle> particles = new ArrayList<Particle>();
          
              // 玩家座標、自動尋路目標與按住連發移動
              int px = 3, py = 7;
              int targetWalkX = -1, targetWalkY = -1; // 點擊地圖遠處時自動一步步走過去
              float renderPx = 3f, renderPy = 7f;
              float camX = 0f, camY = 0f;
              int facingX = 1, facingY = 0;
              float walkCycle = 0f;
              float shockwaveRadius = 0f;
              float swordSlashAngle = 0f; // 揮劍斬擊弧光動畫
          
              // 區網連線 (UDP Port 19876)
              final int LAN_PORT = 19876;
              boolean lanEnabled = false;
              String targetPeerIp = "255.255.255.255";
              String myLocalIp = "偵測中...";
              DatagramSocket udpSocket = null;
              RemotePeer ally = new RemotePeer();
          
              boolean isGenerating = false;
              String apiKey = "";
              String activeModelUsed = "內建因果引擎";
              GameView gameView;
              Random rnd = new Random();
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  SharedPreferences sp = getSharedPreferences("gemini4_rpg_v5", Context.MODE_PRIVATE);
                  apiKey = sp.getString("api_key", "");
                  playerName = sp.getString("player_name", "星輝劍士" + (10 + rnd.nextInt(89)));
                  for (int i = 0; i < 38; i++) particles.add(new Particle(rnd));
                  myLocalIp = detectLocalIp();
                  resetNewGameData();
                  gameView = new GameView(this);
                  setContentView(gameView);
              }
          
              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  lanEnabled = false;
                  if (udpSocket != null) {
                      try { udpSocket.close(); } catch (Exception ignored) {}
                  }
              }
          
              void resetNewGameData() {
                  zoneIndex = 1; level = 1; exp = 0; nextExp = 100;
                  hp = 120; maxHp = 120; mana = 50; maxMana = 100; gold = 80;
                  atk = 15; def = 5;
                  zoneTitle = "A區：遺落星門聖殿"; biome = "ruins"; trait = "星界旅人";
                  isRoadMap = false;
                  targetWalkX = -1; targetWalkY = -1;
                  worldFlags.clear();
                  inventory.clear();
                  history.clear();
                  logs.clear();
                  inventory.add("古舊星盤");
                  history.add("在 A區「遺落星門聖殿」甦醒。");
                  addLog("🌟 歡迎來到《星界迴響》v5 自測疊代完整版！");
                  addLog("🎮 新功能：1.點擊遠處地圖可自動尋路走過去、按住方向鍵可連續行走！ 2.底部可放「🗡️斬擊/⚡脈衝」先手破甲強敵或震碎裂縫牆(棕色格)！ 3.採集翠綠「🌿星光靈草」可直接回血回魔！");
                  initZone1();
              }
          
              void addLog(String s) {
                  logs.add(s);
                  if (logs.size() > 8) logs.remove(0);
              }
          
              void spawnFloat(String text, float x, float y, int color) {
                  floatTexts.add(new FloatText(text, x, y, color));
              }
          
              // 獲得經驗值與自動升等檢核
              void gainExp(int amount) {
                  if (amount <= 0) return;
                  exp += amount;
                  while (exp >= nextExp) {
                      exp -= nextExp;
                      level++;
                      nextExp = 100 + (level - 1) * 50;
                      maxHp += 25;
                      maxMana += 15;
                      hp = maxHp;
                      mana = maxMana;
                      atk += 6;
                      def += 3;
                      shockwaveRadius = 0.2f;
                      spawnFloat("🎉 升至 Lv." + level + " (全狀態回滿！)", px, py - 0.5f, Color.rgb(251, 191, 36));
                      addLog("🎉 【等級提升】你升到了 Lv." + level + "！生命上限+25、攻擊力+6、防禦+3，且體力與共鳴完全恢復！");
                  }
              }
          
              // 根據背包持有的神器動態計算裝備攻擊與防禦加成
              void recalcEquipmentStats() {
                  int bonusAtk = 0, bonusDef = 0;
                  if (inventory.contains("斬鐵星刃") || inventory.contains("深淵魔晶")) bonusAtk += 18;
                  if (inventory.contains("獵犬星牙") || inventory.contains("哨兵殘骸核心")) bonusAtk += 8;
                  if (inventory.contains("守護紋章") || inventory.contains("高階裝甲片")) bonusDef += 10;
                  if (inventory.contains("雙星共鳴徽章")) { bonusAtk += 12; bonusDef += 8; }
                  atk = 15 + (level - 1) * 6 + bonusAtk;
                  def = 5 + (level - 1) * 3 + bonusDef;
              }
          
              boolean checkChoiceAllowed(Choice c) {
                  if (c.requireFlag != null && !c.requireFlag.isEmpty() && !worldFlags.contains(c.requireFlag)) return false;
                  if (c.forbidFlag != null && !c.forbidFlag.isEmpty() && worldFlags.contains(c.forbidFlag)) return false;
                  return true;
              }
          
              boolean isAllyOnline() {
                  return lanEnabled && (System.currentTimeMillis() - ally.lastSeen < 6000);
              }
          
              // ==================== 存檔與讀檔系統 (3 槽位 + 等級與世界狀態保存) ====================
              void saveGameToSlot(int slot) {
                  try {
                      JSONObject obj = new JSONObject();
                      obj.put("zoneIndex", zoneIndex);
                      obj.put("zoneTitle", zoneTitle);
                      obj.put("biome", biome);
                      obj.put("level", level);
                      obj.put("exp", exp);
                      obj.put("nextExp", nextExp);
                      obj.put("hp", hp);
                      obj.put("maxHp", maxHp);
                      obj.put("mana", mana);
                      obj.put("maxMana", maxMana);
                      obj.put("gold", gold);
                      obj.put("trait", trait);
                      obj.put("px", px);
                      obj.put("py", py);
                      obj.put("inventory", new JSONArray(inventory));
                      obj.put("history", new JSONArray(history));
                      obj.put("flags", new JSONArray(worldFlags));
                      String timeStr = new SimpleDateFormat("MM/dd HH:mm", Locale.getDefault()).format(new Date());
                      String summary = "Lv." + level + " " + zoneTitle + " | HP:" + hp + " 🪙:" + gold + " (" + timeStr + ")";
                      obj.put("summary", summary);
          
                      SharedPreferences sp = getSharedPreferences("gemini4_rpg_v5", Context.MODE_PRIVATE);
                      sp.edit()
                          .putString("save_slot_" + slot, obj.toString())
                          .putString("save_summary_" + slot, summary)
                          .apply();
                      spawnFloat("💾 已存檔至槽位 " + slot, px, py, Color.rgb(52, 211, 153));
                      Toast.makeText(this, "✅ 成功儲存至【存檔槽 " + slot + "】！", Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "存檔失敗：" + e.getMessage(), Toast.LENGTH_SHORT).show();
                  }
              }
          
              void loadGameFromSlot(int slot) {
                  SharedPreferences sp = getSharedPreferences("gemini4_rpg_v5", Context.MODE_PRIVATE);
                  String raw = sp.getString("save_slot_" + slot, "");
                  if (raw == null || raw.isEmpty()) {
                      Toast.makeText(this, "⚠️ 存檔槽 " + slot + " 目前是空的！", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  try {
                      JSONObject obj = new JSONObject(raw);
                      zoneIndex = obj.optInt("zoneIndex", 1);
                      zoneTitle = obj.optString("zoneTitle", "A區：遺落星門聖殿");
                      biome = obj.optString("biome", "ruins");
                      level = obj.optInt("level", 1);
                      exp = obj.optInt("exp", 0);
                      nextExp = obj.optInt("nextExp", 100);
                      hp = obj.optInt("hp", 120);
                      maxHp = obj.optInt("maxHp", 120);
                      mana = obj.optInt("mana", 50);
                      maxMana = obj.optInt("maxMana", 100);
                      gold = obj.optInt("gold", 80);
                      trait = obj.optString("trait", "星界旅人");
          
                      inventory.clear();
                      JSONArray invArr = obj.optJSONArray("inventory");
                      if (invArr != null) for (int i = 0; i < invArr.length(); i++) inventory.add(invArr.getString(i));
          
                      history.clear();
                      JSONArray hisArr = obj.optJSONArray("history");
                      if (hisArr != null) for (int i = 0; i < hisArr.length(); i++) history.add(hisArr.getString(i));
          
                      worldFlags.clear();
                      JSONArray flgArr = obj.optJSONArray("flags");
                      if (flgArr != null) for (int i = 0; i < flgArr.length(); i++) worldFlags.add(flgArr.getString(i));
          
                      recalcEquipmentStats();
                      if (zoneIndex == 1) {
                          initZone1();
                      } else {
                          JSONObject zData = buildCausalLocalZone("TELEPORT");
                          zoneIndex--;
                          applyNewZone(zData, "TELEPORT");
                      }
                      px = obj.optInt("px", 3);
                      py = obj.optInt("py", 7);
                      renderPx = px; renderPy = py;
                      targetWalkX = -1; targetWalkY = -1;
                      inTitleScreen = false;
                      addLog("📂 已成功讀取【存檔槽 " + slot + "】進度：" + zoneTitle);
                      spawnFloat("📂 讀檔成功！", px, py, Color.rgb(56, 189, 248));
                  } catch (Exception e) {
                      Toast.makeText(this, "讀檔失敗：" + e.getMessage(), Toast.LENGTH_SHORT).show();
                  }
              }
          
              String getSlotSummary(int slot) {
                  SharedPreferences sp = getSharedPreferences("gemini4_rpg_v5", Context.MODE_PRIVATE);
                  return sp.getString("save_summary_" + slot, "（空存檔槽）");
              }
          
              void openSaveLoadDialog(final boolean isSaveMode) {
                  String[] items = new String[]{
                      "槽位 1：" + getSlotSummary(1),
                      "槽位 2：" + getSlotSummary(2),
                      "槽位 3：" + getSlotSummary(3)
                  };
                  new AlertDialog.Builder(this)
                      .setTitle(isSaveMode ? "💾 選擇要寫入的存檔槽" : "📂 選擇要讀取的進度槽")
                      .setItems(items, new DialogInterface.OnClickListener() {
                          @Override
                          public void onClick(DialogInterface d, int which) {
                              int slot = which + 1;
                              if (isSaveMode) saveGameToSlot(slot);
                              else loadGameFromSlot(slot);
                          }
                      })
                      .setNegativeButton("取消", null)
                      .show();
              }
          
              // ==================== 區網 Wi-Fi / 熱點即時連線與快捷喊話系統 ====================
              String detectLocalIp() {
                  try {
                      Enumeration<NetworkInterface> en = NetworkInterface.getNetworkInterfaces();
                      while (en.hasMoreElements()) {
                          NetworkInterface intf = en.nextElement();
                          Enumeration<InetAddress> enumIpAddr = intf.getInetAddresses();
                          while (enumIpAddr.hasMoreElements()) {
                              InetAddress inetAddress = enumIpAddr.nextElement();
                              if (!inetAddress.isLoopbackAddress() && inetAddress instanceof Inet4Address) {
                                  return inetAddress.getHostAddress();
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return "127.0.0.1";
              }
          
              void startLanMultiplayer() {
                  if (lanEnabled) return;
                  lanEnabled = true;
                  myLocalIp = detectLocalIp();
                  addLog("📡 區網連線已啟動！本機 IP：" + myLocalIp + "（同 Wi-Fi 或熱點下可自動發現盟友並同屏共遊）");
          
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              udpSocket = new DatagramSocket(null);
                              udpSocket.setReuseAddress(true);
                              udpSocket.setBroadcast(true);
                              udpSocket.bind(new InetSocketAddress(LAN_PORT));
                              byte[] buf = new byte[1024];
                              while (lanEnabled) {
                                  DatagramPacket pkt = new DatagramPacket(buf, buf.length);
                                  udpSocket.receive(pkt);
                                  String senderIp = pkt.getAddress().getHostAddress();
                                  if (senderIp.equals(myLocalIp)) continue;
                                  String s = new String(pkt.getData(), 0, pkt.getLength(), "UTF-8");
                                  JSONObject j = new JSONObject(s);
                                  if (j.optString("senderId", "").equals(playerName)) continue;
          
                                  ally.name = j.optString("senderId", "星界盟友");
                                  ally.ip = senderIp;
                                  ally.x = j.optInt("x", 4);
                                  ally.y = j.optInt("y", 7);
                                  ally.zone = j.optInt("zone", 1);
                                  ally.hp = j.optInt("hp", 100);
                                  ally.level = j.optInt("level", 1);
                                  ally.lastSeen = System.currentTimeMillis();
          
                                  final String chat = j.optString("chat", "");
                                  if (!chat.isEmpty()) {
                                      ally.chatBubble = chat;
                                      ally.bubbleTime = System.currentTimeMillis();
                                  }
                                  final String gift = j.optString("gift", "");
                                  if (!gift.isEmpty()) {
                                      runOnUiThread(new Runnable() {
                                          @Override
                                          public void run() {
                                              hp = Math.min(maxHp, hp + 30);
                                              mana = Math.min(maxMana, mana + 20);
                                              spawnFloat("🤝 盟友支援 +30HP!", px, py, Color.rgb(52, 211, 153));
                                              addLog("🌟 收到區網盟友【" + ally.name + "】傳來的星界祝福（HP+30，共鳴+20）！");
                                          }
                                      });
                                  }
                              }
                          } catch (Exception ignored) {}
                      }
                  }).start();
          
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          while (lanEnabled) {
                              broadcastPacket("", "");
                              try { Thread.sleep(220); } catch (Exception ignored) {}
                          }
                      }
                  }).start();
              }
          
              void broadcastPacket(final String giftMsg, final String chatMsg) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (udpSocket == null || udpSocket.isClosed()) return;
                              JSONObject j = new JSONObject();
                              j.put("senderId", playerName);
                              j.put("x", px);
                              j.put("y", py);
                              j.put("zone", zoneIndex);
                              j.put("hp", hp);
                              j.put("level", level);
                              if (giftMsg != null && !giftMsg.isEmpty()) j.put("gift", giftMsg);
                              if (chatMsg != null && !chatMsg.isEmpty()) j.put("chat", chatMsg);
                              byte[] data = j.toString().getBytes("UTF-8");
          
                              DatagramPacket p1 = new DatagramPacket(data, data.length, InetAddress.getByName("255.255.255.255"), LAN_PORT);
                              udpSocket.send(p1);
                              if (!"255.255.255.255".equals(targetPeerIp) && !targetPeerIp.isEmpty()) {
                                  DatagramPacket p2 = new DatagramPacket(data, data.length, InetAddress.getByName(targetPeerIp), LAN_PORT);
                                  udpSocket.send(p2);
                              }
                          } catch (Exception ignored) {}
                      }
                  }).start();
              }
          
              void openLanDialog() {
                  myLocalIp = detectLocalIp();
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(36, 16, 36, 8);
          
                  final EditText nameEt = new EditText(this);
                  nameEt.setHint("你的角色暱稱");
                  nameEt.setText(playerName);
          
                  final EditText ipEt = new EditText(this);
                  ipEt.setHint("對方手機 IP（預設 255.255.255.255 自動搜尋）");
                  ipEt.setText(targetPeerIp);
          
                  final EditText chatEt = new EditText(this);
                  chatEt.setHint("輸入頭頂喊話氣泡（如：一起走東邊古道！）");
          
                  layout.addView(nameEt);
                  layout.addView(ipEt);
                  layout.addView(chatEt);
          
                  String status = isAllyOnline()
                      ? "✅ 已連線盟友：【Lv." + ally.level + " " + ally.name + "】(" + ally.ip + ")"
                      : (lanEnabled ? "📡 區網搜尋中... 請確認兩支手機連上同一個 Wi-Fi 或熱點" : "⚪ 區網連線尚未開啟");
          
                  new AlertDialog.Builder(this)
                      .setTitle("📡 區網雙人共遊 ＆ 即時喊話")
                      .setMessage("本機 IP：" + myLocalIp + "\n" + status)
                      .setView(layout)
                      .setPositiveButton(lanEnabled ? "💬 發送喊話 ＆ 祝福盟友" : "🚀 啟動區網連線", new DialogInterface.OnClickListener() {
                          @Override
                          public void onClick(DialogInterface d, int w) {
                              playerName = nameEt.getText().toString().trim();
                              if (playerName.isEmpty()) playerName = "星輝劍士";
                              targetPeerIp = ipEt.getText().toString().trim();
                              if (targetPeerIp.isEmpty()) targetPeerIp = "255.255.255.255";
                              String chatText = chatEt.getText().toString().trim();
                              getSharedPreferences("gemini4_rpg_v5", Context.MODE_PRIVATE)
                                  .edit().putString("player_name", playerName).apply();
          
                              if (!lanEnabled) {
                                  startLanMultiplayer();
                                  inTitleScreen = false;
                              } else {
                                  if (!chatText.isEmpty()) {
                                      myChatBubble = chatText;
                                      myBubbleTime = System.currentTimeMillis();
                                  }
                                  broadcastPacket("BLESS", chatText);
                                  spawnFloat("📡 已傳送祝福與訊息！", px, py, Color.rgb(56, 189, 248));
                              }
                          }
                      })
                      .setNegativeButton("關閉", null)
                      .show();
              }
          
              // ==================== 雙戰鬥技：🗡️ 星輝斬擊 ＆ ⚡ 星盤脈衝 ====================
              void performActionOrSkill() {
                  if (inTitleScreen || isGenerating) return;
                  // 先釋放近戰「星輝斬擊」劍氣（免費無消耗，可擊暈 1~2 格內巡邏怪與砍草），若有 10 共鳴同時觸發星盤脈衝波！
                  swordSlashAngle = 1.0f;
                  boolean usedPulse = false;
                  if (mana >= 10) {
                      mana -= 10;
                      shockwaveRadius = 0.25f;
                      usedPulse = true;
                  }
          
                  boolean hitAny = false;
                  // 檢查周圍 2 格內的裂縫密室牆 (grid==5) 或靈草 (grid==4)
                  for (int r = Math.max(1, py - 2); r <= Math.min(WORLD_ROWS - 2, py + 2); r++) {
                      for (int c = Math.max(1, px - 2); c <= Math.min(WORLD_COLS - 2, px + 2); c++) {
                          if (Math.abs(c - px) + Math.abs(r - py) <= 2) {
                              if (grid[r][c] == 5) {
                                  grid[r][c] = 0;
                                  gold += 45;
                                  gainExp(25);
                                  spawnFloat("💥 震碎密室牆 +45🪙!", c, r, Color.rgb(251, 191, 36));
                                  addLog("⚡ 你震碎了隱藏的裂縫石牆，發現牆後藏著的 45 星幣與星界秘寶！");
                                  hitAny = true;
                              } else if (grid[r][c] == 4) {
                                  grid[r][c] = 0;
                                  hp = Math.min(maxHp, hp + 20);
                                  mana = Math.min(maxMana, mana + 15);
                                  spawnFloat("🌿 採集靈草 +20HP", c, r, Color.rgb(52, 211, 153));
                                  hitAny = true;
                              }
                          }
                      }
                  }
          
                  // 檢查周圍 2 格內的怪物與寶箱
                  for (int i = entities.size() - 1; i >= 0; i--) {
                      Entity e = entities.get(i);
                      int dist = Math.abs(e.x - px) + Math.abs(e.y - py);
                      if (dist <= 2) {
                          if ("chest".equals(e.type) && usedPulse) {
                              gold += 55;
                              if (!inventory.contains("星界傳送符")) inventory.add("星界傳送符");
                              worldFlags.add("HAS_TELEPORT_RUNE");
                              gainExp(30);
                              spawnFloat("🔓 脈衝開箱 +55🪙!", e.x, e.y, Color.rgb(251, 191, 36));
                              addLog("⚡ 星盤脈衝隔空震開了「" + e.name + "」，取得「星界傳送符」與 55 星幣！");
                              entities.remove(i);
                              hitAny = true;
                          } else if ("monster".equals(e.type)) {
                              if (!e.stunned) {
                                  e.stunned = true;
                                  e.patrolRange = 0; // 被擊暈定身！
                                  gainExp(20);
                                  spawnFloat("🗡️ 破甲擊暈！(敵方弱化)", e.x, e.y, Color.rgb(56, 189, 248));
                                  addLog("🗡️ 你的星輝斬擊精準命中「" + e.name + "」的弱點！敵方已陷入【💫破甲暈眩】狀態，現在上前互動可無傷壓制！");
                              } else {
                                  gold += 50;
                                  gainExp(45);
                                  spawnFloat("⚔️ 斬滅強敵 +50🪙!", e.x, e.y, Color.rgb(251, 191, 36));
                                  addLog("⚔️ 你乘勝追擊徹底擊潰了陷入暈眩的「" + e.name + "」，獲得 50 星幣與 45 EXP！");
                                  entities.remove(i);
                              }
                              hitAny = true;
                          }
                      }
                  }
                  if (!hitAny) {
                      spawnFloat(usedPulse ? "🗡️ 星輝斬 + ⚡脈衝" : "🗡️ 星輝斬擊！", px, py, Color.rgb(56, 189, 248));
                  }
              }
          
